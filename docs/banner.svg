<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250"
     role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">miniVERL</title>
  <desc id="banner-desc">A local runtime for inspectable verl-style on-policy distillation on one CUDA GPU.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030711"/>
      <stop offset="55%" stop-color="#0a1230"/>
      <stop offset="100%" stop-color="#20105a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142342" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#11152c" stop-opacity=".88"/>
    </linearGradient>
    <radialGradient id="violet-glow" cx="82%" cy="9%" r="68%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="43%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="880" height="250" rx="18" fill="url(#bg)"/>
  <rect width="880" height="250" rx="18" fill="url(#violet-glow)"/>
  <rect width="880" height="250" rx="18" fill="url(#cyan-glow)"/>
  <path d="M0 224 C176 198 274 259 443 226 S710 196 880 214 V250 H0Z"
        fill="#38bdf8" opacity=".045"/>
  <rect x=".75" y=".75" width="878.5" height="248.5" rx="17.25"
        fill="none" stroke="#5b7198" stroke-opacity=".34" stroke-width="1.5"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="44" y="32" font-size="10.5" font-weight="750" letter-spacing="2.15" fill="#7dd3fc">
      SINGLE-GPU LLM POST-TRAINING
    </text>
    <text x="44" y="80" font-size="45" font-weight="790" letter-spacing="-1.8" fill="#f8fafc">
      mini<tspan fill="url(#brand)">VERL</tspan>
    </text>
    <text x="44" y="109" font-size="14.8" font-weight="570" fill="#e2e8f0">
      Run verl-style OPD on one consumer GPU.
    </text>
    <text x="44" y="135" font-size="12.8" fill="#a9b8cf">
      Typed config, Parquet prompts, local role scheduling,
    </text>
    <text x="44" y="154" font-size="12.8" fill="#a9b8cf">
      inspectable targets and standard PEFT artifacts.
    </text>

    <g font-size="11.2" font-weight="680">
      <rect x="44" y="173" width="86" height="24" rx="12" fill="#22d3ee" fill-opacity=".12"
            stroke="#67e8f9" stroke-opacity=".38"/>
      <text x="87" y="189.5" text-anchor="middle" fill="#cffafe">1× CUDA GPU</text>
      <rect x="138" y="173" width="112" height="24" rx="12" fill="#60a5fa" fill-opacity=".12"
            stroke="#93c5fd" stroke-opacity=".34"/>
      <text x="194" y="189.5" text-anchor="middle" fill="#dbeafe">BF16 / FP16 auto</text>
      <rect x="258" y="173" width="110" height="24" rx="12" fill="#a78bfa" fill-opacity=".13"
            stroke="#c4b5fd" stroke-opacity=".35"/>
      <text x="313" y="189.5" text-anchor="middle" fill="#ede9fe">typed provenance</text>
    </g>

    <rect x="44" y="208" width="324" height="27" rx="7" fill="#020617" fill-opacity=".72"
          stroke="#516381" stroke-opacity=".42"/>
    <circle cx="59" cy="221.5" r="3" fill="#22d3ee"/>
    <text x="70" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11.3" fill="#dbeafe">pip install miniverl</text>

    <path d="M401 49 V201" fill="none" stroke="#33486d" stroke-width="2"
          stroke-linecap="round"/>
    <circle cx="401" cy="58" r="4" fill="#22d3ee"/>
    <circle cx="401" cy="125" r="4" fill="#60a5fa"/>
    <circle cx="401" cy="192" r="4" fill="#c084fc"/>

    <g>
      <rect x="420" y="29" width="414" height="56" rx="13" fill="url(#card)"
            stroke="#4c6388" stroke-opacity=".55"/>
      <circle cx="450" cy="57" r="16" fill="#22d3ee" opacity=".12" filter="url(#soft-glow)"/>
      <circle cx="450" cy="57" r="14" fill="#0e7490" fill-opacity=".28"
              stroke="#67e8f9" stroke-opacity=".52"/>
      <path d="M444 57h12M450 51v12" stroke="#a5f3fc" stroke-width="1.8"
            stroke-linecap="round"/>
      <text x="478" y="52" font-size="14" font-weight="720" fill="#f8fafc">Compile</text>
      <text x="478" y="71" font-size="12" fill="#afbed3">verl-shaped YAML · typed compatibility report</text>
    </g>

    <g>
      <rect x="420" y="97" width="414" height="56" rx="13" fill="url(#card)"
            stroke="#4c6388" stroke-opacity=".55"/>
      <circle cx="450" cy="125" r="16" fill="#60a5fa" opacity=".12" filter="url(#soft-glow)"/>
      <circle cx="450" cy="125" r="14" fill="#1d4ed8" fill-opacity=".25"
              stroke="#93c5fd" stroke-opacity=".52"/>
      <path d="M443 121h14M443 125h9M443 129h12" stroke="#dbeafe" stroke-width="1.8"
            stroke-linecap="round"/>
      <text x="478" y="120" font-size="14" font-weight="720" fill="#f8fafc">Run locally</text>
      <text x="478" y="139" font-size="12" fill="#afbed3">actor rollout · teacher score · actor update</text>
    </g>

    <g>
      <rect x="420" y="165" width="414" height="56" rx="13" fill="url(#card)"
            stroke="#4c6388" stroke-opacity=".55"/>
      <circle cx="450" cy="193" r="16" fill="#c084fc" opacity=".12" filter="url(#soft-glow)"/>
      <circle cx="450" cy="193" r="14" fill="#7e22ce" fill-opacity=".25"
              stroke="#d8b4fe" stroke-opacity=".52"/>
      <path d="M443 197l5-7 5 4 5-8" fill="none" stroke="#f3e8ff" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="478" y="188" font-size="14" font-weight="720" fill="#f8fafc">Inspect &amp; export</text>
      <text x="478" y="207" font-size="12" fill="#afbed3">PEFT · Parquet · targets · metrics · provenance</text>
    </g>
  </g>
</svg>
