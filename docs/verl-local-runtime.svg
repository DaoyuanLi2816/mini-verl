<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">miniVERL semantic lowering and local execution flow</title>
  <desc id="desc">A resolved verl configuration and Parquet prompts enter a versioned compiler, then one GPU schedules actor rollout, reward, reference, teacher and critic phases. Inspectable artifacts retain explicit readiness states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#111b38"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1120" height="500" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1118" height="498" rx="23" fill="none" stroke="#475569"/>
  <g font-family="Inter,DejaVu Sans,Segoe UI,sans-serif">
    <text x="48" y="54" fill="#f8fafc" font-size="25" font-weight="750">verl experiment semantics, lowered onto one GPU</text>
    <text x="48" y="82" fill="#94a3b8" font-size="18">Every boundary is typed, recorded, and resumable.</text>

    <g fill="#0f2740" stroke="#38bdf8">
      <rect x="48" y="124" width="244" height="124" rx="16"/>
      <rect x="342" y="124" width="244" height="124" rx="16"/>
      <rect x="636" y="124" width="436" height="124" rx="16"/>
    </g>
    <text x="70" y="158" fill="#67e8f9" font-size="18" font-weight="700">INPUTS</text>
    <text x="70" y="190" fill="#f8fafc" font-size="18" font-weight="700">verl-shaped YAML</text>
    <text x="70" y="215" fill="#cbd5e1" font-size="18">YAML overrides</text>
    <text x="70" y="239" fill="#cbd5e1" font-size="18">Parquet prompts</text>
    <text x="364" y="158" fill="#67e8f9" font-size="18" font-weight="700">COMPILER</text>
    <text x="364" y="190" fill="#f8fafc" font-size="18" font-weight="700">Typed compatibility</text>
    <text x="364" y="215" fill="#cbd5e1" font-size="18">conformant · lowered</text>
    <text x="364" y="239" fill="#cbd5e1" font-size="18">or rejected</text>
    <text x="658" y="153" fill="#67e8f9" font-size="18" font-weight="700">LOCAL ROLES · 1× CUDA GPU</text>
    <g fill="#172554" stroke="#818cf8">
      <rect x="658" y="166" width="122" height="74" rx="12"/><rect x="792" y="166" width="122" height="74" rx="12"/><rect x="926" y="166" width="122" height="74" rx="12"/>
    </g>
    <text x="719" y="197" text-anchor="middle" fill="#e0e7ff" font-size="18" font-weight="650">actor</text><text x="719" y="221" text-anchor="middle" fill="#e0e7ff" font-size="18">rollout</text>
    <text x="853" y="186" text-anchor="middle" fill="#e0e7ff" font-size="18">reward / ref</text><text x="853" y="209" text-anchor="middle" fill="#e0e7ff" font-size="18">teacher</text><text x="853" y="232" text-anchor="middle" fill="#e0e7ff" font-size="18">value</text>
    <text x="987" y="197" text-anchor="middle" fill="#e0e7ff" font-size="18">actor / critic</text><text x="987" y="221" text-anchor="middle" fill="#e0e7ff" font-size="18">updates</text>

    <path d="M292 186h42" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M586 186h42" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M716 248v48" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="342" y="306" width="730" height="84" rx="16" fill="#18213c" stroke="#a78bfa"/>
    <text x="364" y="333" fill="#c4b5fd" font-size="18" font-weight="700">INSPECTABLE OUTPUTS</text>
    <text x="364" y="357" fill="#f8fafc" font-size="18" font-weight="650">checkpoints · PEFT · rewards / targets · trajectories</text>
    <text x="364" y="382" fill="#cbd5e1" font-size="18">metrics · provenance · source and compatibility records</text>
    <path d="M707 390v42" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="342" y="440" width="468" height="38" rx="12" fill="#12313a" stroke="#2dd4bf"/>
    <text x="576" y="465" text-anchor="middle" fill="#ccfbf1" font-size="18" font-weight="700">portable PEFT + Parquet + config artifacts</text>
    <rect x="830" y="432" width="242" height="54" rx="12" fill="#24204a" stroke="#a78bfa"/>
    <text x="951" y="451" text-anchor="middle" fill="#ddd6fe" font-size="18" font-weight="750">READINESS REPORT</text>
    <text x="951" y="477" text-anchor="middle" fill="#f5f3ff" font-size="18">bundle / launch / run</text>
  </g>
</svg>
