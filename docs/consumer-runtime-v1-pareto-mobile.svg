<svg xmlns="http://www.w3.org/2000/svg" width="390" height="570" viewBox="0 0 390 570" role="img" aria-labelledby="title desc"><title id="title">Batch-4 is the Pareto knee on one RTX 4080</title><desc id="desc">Vertical mobile table of throughput and peak reserved CUDA memory for the shared-backbone and dual-model runtimes at physical trajectory batch sizes 1, 2, 4 and auto. Every value is printed as text; shared batch-4 reaches 3.48 trajectories per second at 2.23 GiB and dual batch-4 reaches 3.87 at 3.04 GiB.</desc><rect width="390" height="570" rx="16" fill="#060a14"/><rect x="12" y="12" width="366" height="546" rx="12" fill="#0a1222" stroke="#20304f"/><style>text{font-family:Inter,'Segoe UI',sans-serif;fill:#edf4ff}.title{font-size:19px;font-weight:760}.sub{font-size:14px;fill:#aebbd2}.runtime{font-size:16px;font-weight:740}.head{font-size:14px;font-weight:700;fill:#dce7f8}.cell{font-size:15px;font-weight:700}.foot{font-size:14px;fill:#aebbd2}</style><text class="title" x="24" y="42">Batch-4 is the Pareto</text><text class="title" x="24" y="70">knee on one RTX 4080</text><text class="sub" x="24" y="97">8-trajectory strict OPD update · Qwen3-0.6B</text><text class="sub" x="24" y="118">NF4 weights / FP32 compute · 3-update medians</text><rect x="24" y="140" width="4" height="20" rx="2" fill="#22d3ee"/><text class="runtime" x="38" y="157" fill="#22d3ee">shared backbone</text><text class="head" x="38" y="184">batch</text><text class="head" x="228" y="184" text-anchor="end">traj/s</text><text class="head" x="366" y="184" text-anchor="end">GiB</text><text class="cell" x="38" y="210">1</text><text class="cell" x="228" y="210" text-anchor="end">2.25</text><text class="cell" x="366" y="210" text-anchor="end">2.22</text><text class="cell" x="38" y="236">2</text><text class="cell" x="228" y="236" text-anchor="end">3.27</text><text class="cell" x="366" y="236" text-anchor="end">2.22</text><text class="cell" x="38" y="262" font-weight="800">4</text><text class="cell" x="228" y="262" text-anchor="end" font-weight="800">3.47</text><text class="cell" x="366" y="262" text-anchor="end" font-weight="800">2.23</text><text class="cell" x="38" y="288">auto</text><text class="cell" x="228" y="288" text-anchor="end">2.90</text><text class="cell" x="366" y="288" text-anchor="end">3.83</text><rect x="24" y="318" width="4" height="20" rx="2" fill="#fb7185"/><text class="runtime" x="38" y="335" fill="#fb7185">dual model</text><text class="head" x="38" y="362">batch</text><text class="head" x="228" y="362" text-anchor="end">traj/s</text><text class="head" x="366" y="362" text-anchor="end">GiB</text><text class="cell" x="38" y="388">1</text><text class="cell" x="228" y="388" text-anchor="end">2.37</text><text class="cell" x="366" y="388" text-anchor="end">2.55</text><text class="cell" x="38" y="414">2</text><text class="cell" x="228" y="414" text-anchor="end">3.52</text><text class="cell" x="366" y="414" text-anchor="end">2.89</text><text class="cell" x="38" y="440" font-weight="800">4</text><text class="cell" x="228" y="440" text-anchor="end" font-weight="800">3.87</text><text class="cell" x="366" y="440" text-anchor="end" font-weight="800">3.04</text><text class="cell" x="38" y="466">auto</text><text class="cell" x="228" y="466" text-anchor="end">3.08</text><text class="cell" x="366" y="466" text-anchor="end">4.57</text><line x1="24" y1="504" x2="366" y2="504" stroke="#20304f"/><text class="foot" x="24" y="528">Higher traj/s and lower GiB is better.</text><text class="foot" x="24" y="547">auto = all 8 padded trajectories.</text><text class="foot" x="24" y="566">source SHA-256 a302da31af99f1d2</text></svg>
