<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="698" viewBox="0 0 1120 698" role="img">
  <title>External alignment study flow stopped at checkpoint selection</title>
  <desc>Endpoint governance and candidate generation completed. Candidate selection stopped because retained utility was zero of 64. Teacher qualification and continuation training did not run, and the reserved final test was not accessed.</desc>
