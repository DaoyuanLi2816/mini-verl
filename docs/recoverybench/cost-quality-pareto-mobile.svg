<svg xmlns="http://www.w3.org/2000/svg" width="390" height="866" viewBox="0 0 390 866" role="img" aria-labelledby="title desc"><title id="title">Recovery quality with continuation cost</title><desc id="desc">Vertical mobile chart pairing each RecoveryBench arm's three-seed mean recovery-after-error rate with its continuation training time as a fraction of the slowest arm. Both values are printed as text.</desc><rect width="390" height="866" rx="16" fill="#060a14"/><rect x="12" y="12" width="366" height="842" rx="12" fill="#0a1222" stroke="#20304f"/><style>text{font-family:Inter,'Segoe UI',sans-serif;fill:#edf4ff}.title{font-size:19px;font-weight:760}.sub{font-size:14px;fill:#aebbd2}.label{font-size:16px;font-weight:700}.series{font-size:14px;fill:#c3cfe2}.value{font-size:15px;font-weight:760}</style><text class="title" x="24" y="34">Recovery quality with</text><text class="title" x="24" y="62">continuation cost</text><text class="sub" x="24" y="98">Three-seed means · normalized scale · source</text><text class="sub" x="24" y="119">6ce2e6837e12</text><text class="label" x="24" y="170">cold-start-only</text><text class="series" x="24" y="196">recovery after error</text><text class="value" x="366" y="196" text-anchor="end">0.136</text><rect x="24" y="204" width="46.6" height="12" rx="6" fill="#38bdf8"/><text class="series" x="24" y="240">train seconds / slowest</text><text class="value" x="366" y="240" text-anchor="end">0.000</text><rect x="24" y="248" width="0.1" height="12" rx="6" fill="#a78bfa"/><text class="label" x="24" y="288">continued-sft</text><text class="series" x="24" y="314">recovery after error</text><text class="value" x="366" y="314" text-anchor="end">0.018</text><rect x="24" y="322" width="6.0" height="12" rx="6" fill="#38bdf8"/><text class="series" x="24" y="358">train seconds / slowest</text><text class="value" x="366" y="358" text-anchor="end">0.071</text><rect x="24" y="366" width="24.3" height="12" rx="6" fill="#a78bfa"/><text class="label" x="24" y="406">offline-kd-oracle</text><text class="series" x="24" y="432">recovery after error</text><text class="value" x="366" y="432" text-anchor="end">0.319</text><rect x="24" y="440" width="109.2" height="12" rx="6" fill="#38bdf8"/><text class="series" x="24" y="476">train seconds / slowest</text><text class="value" x="366" y="476" text-anchor="end">0.081</text><rect x="24" y="484" width="27.6" height="12" rx="6" fill="#a78bfa"/><text class="label" x="24" y="524">offline-kd-frozen-student</text><text class="series" x="24" y="550">recovery after error</text><text class="value" x="366" y="550" text-anchor="end">0.228</text><rect x="24" y="558" width="77.9" height="12" rx="6" fill="#38bdf8"/><text class="series" x="24" y="594">train seconds / slowest</text><text class="value" x="366" y="594" text-anchor="end">0.072</text><rect x="24" y="602" width="24.7" height="12" rx="6" fill="#a78bfa"/><text class="label" x="24" y="642">strict-opd-fresh</text><text class="series" x="24" y="668">recovery after error</text><text class="value" x="366" y="668" text-anchor="end">0.091</text><rect x="24" y="676" width="31.2" height="12" rx="6" fill="#38bdf8"/><text class="series" x="24" y="712">train seconds / slowest</text><text class="value" x="366" y="712" text-anchor="end">0.953</text><rect x="24" y="720" width="325.9" height="12" rx="6" fill="#a78bfa"/><text class="label" x="24" y="760">strict-opd-fresh-budget50</text><text class="series" x="24" y="786">recovery after error</text><text class="value" x="366" y="786" text-anchor="end">0.207</text><rect x="24" y="794" width="70.8" height="12" rx="6" fill="#38bdf8"/><text class="series" x="24" y="830">train seconds / slowest</text><text class="value" x="366" y="830" text-anchor="end">1.000</text><rect x="24" y="838" width="342.0" height="12" rx="6" fill="#a78bfa"/></svg>
