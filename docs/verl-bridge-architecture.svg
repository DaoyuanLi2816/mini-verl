<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Scale-out bridge: verified artifacts, bounded claims</title><desc id="desc">Three verified layers connect miniVERL local runtime artifacts to a pinned verl parse and load smoke. A dashed arrow leads to distributed execution marked not tested.</desc><rect width="1120" height="760" rx="22" fill="#060a14"/><style>text{font-family:'DejaVu Sans','Segoe UI',sans-serif;fill:#edf4ff}.title{font-size:30px;font-weight:760}.sub{font-size:17px;fill:#aebbd2}.layer{font-size:20px;font-weight:760}.body{font-size:16px;fill:#c2cee1}.role{font-size:15px;font-weight:700}.status{font-size:22px;font-weight:800}.foot{font-size:15px;fill:#9fb0ca}</style><text class="title" data-role="diagram-label" x="48" y="58">Scale-out bridge: verified artifacts, bounded claims</text><text class="sub" data-role="diagram-label" x="48" y="88">pinned upstream v0.8.0 · 7aed6b23 · independent project; no endorsement</text><rect x="70" y="122" width="980" height="132" rx="18" fill="#0d1d34" stroke="#2f6fa2" stroke-width="2"/><text class="layer" data-role="diagram-label" x="98" y="154">1 · miniVERL local runtime</text><text class="body" data-role="diagram-label" x="98" y="181">single-GPU training, evaluation and portable provenance</text><rect x="98" y="199" width="210" height="38" rx="9" fill="#12304d"/><text class="role" data-role="diagram-label" x="116" y="224">teacher role · targets</text><rect x="322" y="199" width="214" height="38" rx="9" fill="#2d2343"/><text class="role" data-role="diagram-label" x="340" y="224">reference role · DPO</text><rect x="550" y="199" width="224" height="38" rx="9" fill="#16372f"/><text class="role" data-role="diagram-label" x="568" y="224">reward role · verifier</text><rect x="788" y="199" width="234" height="38" rx="9" fill="#352d17"/><text class="role" data-role="diagram-label" x="806" y="224">student · local updates</text><line x1="560" y1="254" x2="560" y2="285" stroke="#80c7ff" stroke-width="4"/><polygon points="551,278 569,278 560,291" fill="#80c7ff"/><rect x="100" y="291" width="920" height="148" rx="18" fill="#101f38" stroke="#4e87b7" stroke-width="2"/><text class="layer" data-role="diagram-label" x="128" y="326">2 · portable artifact bundle</text><text class="body" data-role="diagram-label" x="128" y="353">standard formats with explicit config and provenance boundaries</text><rect x="128" y="374" width="132" height="40" rx="10" fill="#16314f"/><text class="role" data-role="diagram-label" x="153" y="400">PEFT</text><rect x="274" y="374" width="144" height="40" rx="10" fill="#16314f"/><text class="role" data-role="diagram-label" x="293" y="400">safetensors</text><rect x="432" y="374" width="132" height="40" rx="10" fill="#16314f"/><text class="role" data-role="diagram-label" x="459" y="400">Parquet</text><rect x="578" y="374" width="174" height="40" rx="10" fill="#16314f"/><text class="role" data-role="diagram-label" x="596" y="400">resolved config</text><rect x="766" y="374" width="226" height="40" rx="10" fill="#16314f"/><text class="role" data-role="diagram-label" x="788" y="400">typed provenance</text><line x1="560" y1="439" x2="560" y2="470" stroke="#80c7ff" stroke-width="4"/><polygon points="551,463 569,463 560,476" fill="#80c7ff"/><rect x="100" y="476" width="920" height="108" rx="18" fill="#10283b" stroke="#3c9f9a" stroke-width="2"/><text class="layer" data-role="diagram-label" x="128" y="515">3 · pinned upstream parse/load smoke</text><text class="body" data-role="diagram-label" x="128" y="545">verl v0.8.0 at 7aed6b23 · config parse + PEFT/safetensors/Parquet structural load checks</text><text class="body" data-role="diagram-label" x="128" y="568">verified boundary: artifact interchange and the documented profile subset</text><line x1="560" y1="584" x2="560" y2="621" stroke="#f29d65" stroke-width="4" stroke-dasharray="10 8"/><polygon points="551,614 569,614 560,627" fill="#f2