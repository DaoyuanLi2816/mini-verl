<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 470" width="390" height="470" role="img" aria-labelledby="title desc">
  <title id="title">miniVERL — single-GPU LLM post-training</title>
  <desc id="desc">Run PPO, GRPO and distillation on one NVIDIA GPU, then resume or export your model.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030711"/><stop offset="1" stop-color="#20105a"/></linearGradient>
    <linearGradient id="brand"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  </defs>
  <rect width="390" height="470" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="388" height="468" rx="17" fill="none" stroke="#4c6388"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" letter-spacing=".7" font-weight="700" fill="#7dd3fc">SINGLE-GPU LLM POST-TRAINING</text>
    <text x="24" y="83" font-size="44" font-weight="800" fill="#f8fafc">mini<tspan fill="url(#brand)">VERL</tspan></text>
    <text x="24" y="116" font-size="19" font-weight="700" fill="#e2e8f0">verl for a single consumer GPU.</text>
    <text x="24" y="143" font-size="14" fill="#a9b8cf">BF16 / FP16 auto · typed provenance</text>
    <g fill="#142342" stroke="#4c6388">
      <rect x="24" y="165" width="342" height="68" rx="12"/>
      <rect x="24" y="245" width="342" height="68" rx="12"/>
      <rect x="24" y="325" width="342" height="68" rx="12"/>
    </g>
    <g font-size="18" font-weight="700">
      <text x="42" y="192" fill="#67e8f9">Bring your configs</text>
      <text x="42" y="272" fill="#93c5fd">Run locally</text>
      <text x="42" y="352" fill="#d8b4fe">Inspect &amp; export</text>
    </g>
    <g font-size="14" fill="#cbd5e1">
      <text x="42" y="215">verl configs · overrides · local data</text>
      <text x="42" y="295">Rollouts · local roles · model updates</text>
      <text x="42" y="375">PEFT · Parquet · metrics · provenance</text>
    </g>
    <rect x="24" y="413" width="342" height="34" rx="8" fill="#020617" stroke="#516381"/>
    <text x="42" y="436" font-family="Consolas, monospace" font-size="15" fill="#dbeafe">pip install miniverl</text>
  </g>
</svg>
