<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Batch-4 is the Pareto knee on one RTX 4080</title><desc id="desc">Throughput versus peak reserved CUDA memory for dual-model and shared-backbone runtimes at physical trajectory batch sizes 1, 2, 4 and auto. Shared batch-4 reaches 3.48 trajectories per second at 2.23 GiB; dual batch-4 reaches 3.87 trajectories per second at 3.04 GiB.</desc><rect width="1120" height="620" rx="24" fill="#070b17"/><rect x="20" y="20" width="1080" height="580" rx="20" fill="#0b1224" stroke="#20304f"/><style>text{font-family:Inter,'Segoe UI',sans-serif;fill:#e8eefc}.title{font-size:30px;font-weight:760}.sub{font-size:16px;fill:#9fb0cc}.axis{font-size:14px;fill:#91a1bd}.point{font-size:14px;font-weight:750}.metric{font-size:25px;font-weight:760}.small{font-size:14px;fill:#9fb0cc}.legend{font-size:15px;font-weight:650}.foot{font-size:15px;fill:#91a1bd}</style><text class="title" x="52" y="66">Batch-4 is the Pareto knee on one RTX 4080</text><text class="sub" x="52" y="96">8-trajectory strict OPD update · Qwen3-0.6B · NF4 weights / FP32 compute · medians over 3 updates</text><circle cx="550" cy="129" r="6" fill="#fb7185"/><text class="legend" x="564" y="134">dual model</text><circle cx="664" cy="129" r="6" fill="#22d3ee"/><text class="legend" x="678" y="134">shared backbone</text><line x1="88.0" y1="162.0" x2="88.0" y2="500.0" stroke="#22304b"/><text class="axis" x="88.0" y="525" text-anchor="middle">2.0</text><line x1="213.4" y1="162.0" x2="213.4" y2="500.0" stroke="#22304b"/><text class="axis" x="213.4" y="525" text-anchor="middle">2.5</text><line x1="338.7" y1="162.0" x2="338.7" y2="500.0" stroke="#22304b"/><text class="axis" x="338.7" y="525" text-anchor="middle">3.0</text><line x1="464.1" y1="162.0" x2="464.1" y2="500.0" stroke="#22304b"/><text class="axis" x="464.1" y="525" text-anchor="middle">3.5</text><line x1="589.4" y1="162.0" x2="589.4" y2="500.0" stroke="#22304b"/><text class="axis" x="589.4" y="525" text-anchor="middle">4.0</text><line x1="714.8" y1="162.0" x2="714.8" y2="500.0" stroke="#22304b"/><text class="axis" x="714.8" y="525" text-anchor="middle">4.5</text><line x1="88.0" y1="470.6" x2="790.0" y2="470.6" stroke="#22304b"/><text class="axis" x="72" y="475.6" text-anchor="end">2.0</text><line x1="88.0" y1="397.1" x2="790.0" y2="397.1" stroke="#22304b"/><text class="axis" x="72" y="402.1" text-anchor="end">2.5</text><line x1="88.0" y1="323.7" x2="790.0" y2="323.7" stroke="#22304b"/><text class="axis" x="72" y="328.7" text-anchor="end">3.0</text><line x1="88.0" y1="250.2" x2="790.0" y2="250.2" stroke="#22304b"/><text class="axis" x="72" y="255.2" text-anchor="end">3.5</text><line x1="88.0" y1="176.7" x2="790.0" y2="176.7" stroke="#22304b"/><text class="axis" x="72" y="181.7" text-anchor="end">4.0</text><text class="axis" x="439" y="554" text-anchor="middle">peak reserved CUDA memory (GiB) →</text><text class="axis" x="24" y="335" transform="rotate(-90 24 335)" text-anchor="middle">trajectories / second →</text><polyline points="226.1,416.3 311.8,246.8 347.5,196.4 731.9,312.6" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><circle cx="226.1" cy="416.3" r="8" fill="#0b1224" stroke="#fb7185" stroke-width="4"/><text class="point" x="193.1" y="403.3" fill="#fb7185">b1</text><circle cx="311.8" cy="246.8" r="8" fill="#0b1224" stroke="#fb7185" stroke-width="4"/><text class="point" x="303.8" y="232.8" fill="#fb7185">b2</text><circle cx="347.5" cy="196.4" r="8" fill="#0b1224" stroke="#fb7185" stroke-width="4"/><text class="point" x="358.5" y="184.4" fill="#fb7185">b4</text><circle cx="731.9" cy="312.6" r="8" fill="#0b1224" stroke="#fb7185" stroke-width="4"/><text class="point" x="741.9" y="332.6" fill="#fb7185">auto</text><polyline points="143.8,433.7 144.3,283.8 144.8,253.9 547.8,337.8" fill="none" stroke="#22d3ee" stroke-width="3" stroke-l