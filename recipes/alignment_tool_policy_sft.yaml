# Shared post-SFT starting point for the v0.5 Alignment Lab.
# The sandbox executes only in-memory actions; no host file or external service is touched.

schema_version: 1

run:
  name: qwen3-tool-policy-sft
  mode: sft
  seed: 20260802
  output_dir: runs
  deterministic: true
  tags: [alignment, common-start, qwen3, single-gpu, tool-policy]

models:
  backend: hf
  runtime: dual_model
  device: auto
  student:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: auto
    quantization: nf4
    attn_implementation: eager
    gradient_checkpointing: true
    lora:
      enabled: true
      r: 16
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  teacher:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: auto
    quantization: nf4
    attn_implementation: eager
    mode: standard

environment:
  name: tool_policy
  difficulty: easy
  params:
    protocol_version: v2
    prompt_style: full
  train_tasks: 192
  eval_tasks: 48
  test_tasks: 48
  split_seed: 20260802

rollout:
  max_turns: 4
  max_new_tokens_per_turn: 64
  max_total_tokens: 1024
  temperature: 0.8
  top_p: 0.95
  max_parse_errors: 2
  max_repeated_calls: 2

selection:
  selector: all_model_tokens

loss:
  mode: bucketed_topk_tail
  divergence: reverse_kl
  top_k: 64
  chunk_size: 128

train:
  cycles: 48
  rollouts_per_cycle: 4
  gradient_accumulation_steps: 4
  trajectory_batch_size: 4
  length_bucketing: true
  learning_rate: 2.0e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_steps: 4
  lr_schedule: cosine
  optimizer: adamw8bit
  sft_warmup_cycles: 0
  save_every_cycles: 24
  eval_every_cycles: 0

memory:
  strategy: resident
  oom_retries: 3
  min_chunk_size: 16

cache:
  entries_per_shard: 8
  strict_policy_version: true
  reuse_across_policy_versions: false
  dtype: float16
  keep_cycles: 2

eval:
  enabled: true
  baseline_enabled: true
  split: eval
  tasks: 24
  temperature: 0.0
  max_turns: 4
  seed: 20260802

report:
  enabled: true
  max_trajectories: 6
  max_tokens_per_trajectory: 512
