# miniVERL supported 16 GB recipe: on-policy distillation of Qwen3-0.6B from a
# protocol-aligned Qwen3-1.7B teacher on one consumer GPU.
#
# Verified facts about this model pair (checked against the Hugging Face API on
# 2026-07-27, and re-checkable with the commands in docs/reproducibility.md):
#   * both repositories are Apache-2.0;
#   * tokenizer.json is BYTE-IDENTICAL across the pair
#     (sha256 aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4);
#   * vocab_size 151936, tokenizer_class Qwen2Tokenizer, tie_word_embeddings true;
#   * Qwen3 needs transformers >= 4.51.
#
# The model and adapter revisions below are pinned. The teacher adapter passed
# an independent 100% strict tool-policy evaluation before the downstream OPD
# result was inspected. miniVERL checks that competence record before loading.
#
#   miniverl doctor
#   miniverl validate recipes/qwen_consumer_gpu_calc.yaml
#   miniverl train    recipes/qwen_consumer_gpu_calc.yaml --dry-run
#   miniverl train    recipes/qwen_consumer_gpu_calc.yaml
#
# Measured base-pair memory and the two-seed protocol-teacher comparison are in
# docs/rtx4080-baselines.md. The historical protocol-naive recipe is preserved
# separately as qwen_consumer_gpu_calc_raw_teacher.yaml.

schema_version: 1

run:
  name: qwen3-calc-opd-protocol-4080
  mode: opd
  seed: 1234
  output_dir: runs
  deterministic: true
  tags: [consumer-gpu, rtx4080, qwen3, calculator, protocol-teacher]

models:
  backend: hf
  device: auto
  student:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: bfloat16
    # QLoRA: NF4 weights + double quantization. Measured on an RTX 4080 this
    # costs ~20% decode throughput versus bf16 LoRA and saves ~0.3 GiB on a
    # 0.6B student -- the win only matters once the teacher grows. Both
    # measurements are in docs/rtx4080-baselines.md; nf4 is the default here
    # because it is the path that scales.
    quantization: nf4
    attn_implementation: sdpa
    gradient_checkpointing: true
    lora:
      enabled: true
      r: 16
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  teacher:
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    tokenizer_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    dtype: bfloat16            # a bf16 1.7B teacher is ~4.1 GiB; it fits
    quantization: none
    attn_implementation: sdpa
    mode: standard
    adapter:
      source: hub
      path: DaoyuanLi/mini-verl-qwen3-1.7b-protocol-teacher
      revision: 23323751318135484c06c043b1f9b9e7016dd89f
      require_policy_evaluation: true
      minimum_strict_success_rate: 0.5

environment:
  name: calculator
  difficulty: medium
  params:
    prompt_style: full
    protocol_version: v1
  train_tasks: 256
  eval_tasks: 48
  test_tasks: 48
  split_seed: 7

rollout:
  max_turns: 3
  # Sized from measured throughput: single-sequence decode on this machine runs
  # at ~12 tok/s because it is kernel-launch bound, not compute bound (a
  # 14-token prefill costs the same as a 1-token cached step). See
  # docs/rtx4080-baselines.md.
  max_new_tokens_per_turn: 48
  max_total_tokens: 704
  temperature: 1.0
  top_p: 0.95
  max_parse_errors: 2
  max_repeated_calls: 2

selection:
  # `hybrid` keeps every structurally critical assistant token (the tool-call
  # payload and the final answer) and deterministically samples the rest until
  # the budget is met. It reduces cache size and loss positions -- it does NOT
  # proportionally reduce teacher FLOPs, because the teacher still runs a full
  # forward pass to produce the hidden states.
  selector: hybrid
  ratio: 0.6
  critical_weight: 1.0
  other_weight: 1.0

loss:
  mode: bucketed_topk_tail     # 151936-way exact KL is not affordable here
  divergence: reverse_kl       # mode-seeking; the usual OPD objective
  temperature: 1.0
  scale_by_temperature_squared: true
  top_k: 64
  tail_epsilon: 1.0e-9
  chunk_size: 256              # peak vocabulary tensor is [256, 151936]
  sampled_token_nll_weight: 0.0

train:
  cycles: 8
  rollouts_per_cycle: 6
  gradient_accumulation_steps: 6   # exactly one on-policy step per rollout batch
  opd_freshness: strict
  learning_rate: 1.0e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_steps: 2
  lr_schedule: cosine
  optimizer: adamw8bit         # paged 8-bit Adam keeps optimizer state small
  sft_warmup_cycles: 8         # oracle cold start (no generation: cheap)
  save_every_cycles: 4
  eval_every_cycles: 4

memory:
  strategy: auto               # resolves to resident for a quantized student
  oom_retries: 3
  min_chunk_size: 16
  empty_cache_between_phases: true
  reset_peak_stats_each_cycle: true
  auto_swap_vram_headroom_gb: 2.0

cache:
  entries_per_shard: 8
  strict_policy_version: true
  reuse_across_policy_versions: false
  dtype: float16               # halves the log-prob payload; ~1e-3 precision
  keep_cycles: 2
  verify_checksums_on_load: true

eval:
  enabled: true
  split: eval
  tasks: 12
  temperature: 0.0
  seed: 0

report:
  enabled: true
  max_trajectories: 4
  max_tokens_per_trajectory: 320
