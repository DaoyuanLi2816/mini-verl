# miniVERL 16 GB recipe: JSON navigation with a PRIVILEGED-CONTEXT teacher.
#
# This recipe exercises the second teacher mode. The teacher receives an extra
# system block naming the resolved path and the verified answer; the student
# never sees it. Because the teacher's sequence is longer, student and teacher
# prediction positions no longer coincide, so miniVERL builds an explicit
# per-segment alignment map and refuses to proceed unless the *target token ids*
# are identical on both sides.
#
# The setup follows "On-Policy Context Distillation for Language Models"
# (arXiv:2602.12275), which trains a student on its own trajectories against a
# context-conditioned teacher. See docs/references.md.
#
# Model pair and revisions are the same verified Apache-2.0 Qwen3 pair used by
# recipes/qwen_consumer_gpu_calc.yaml.
#
#   miniverl validate recipes/qwen_consumer_gpu_jsonnav.yaml
#   miniverl train    recipes/qwen_consumer_gpu_jsonnav.yaml

schema_version: 1

run:
  name: qwen3-jsonnav-opd-privileged
  mode: opd
  seed: 2718
  output_dir: runs
  deterministic: true
  tags: [consumer-gpu, rtx4080, qwen3, jsonnav, privileged-context]

models:
  backend: hf
  device: auto
  student:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: bfloat16
    quantization: nf4
    attn_implementation: sdpa
    gradient_checkpointing: true
    lora:
      enabled: true
      r: 16
      alpha: 32
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  teacher:
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    tokenizer_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    dtype: bfloat16
    quantization: none
    attn_implementation: sdpa
    mode: privileged_context   # <- the teacher sees the oracle path and answer

environment:
  name: jsonnav
  difficulty: medium           # requires find -> get, two dependent calls
  params:
    prompt_style: full
  train_tasks: 192
  eval_tasks: 32
  test_tasks: 32
  split_seed: 13

rollout:
  max_turns: 4
  max_new_tokens_per_turn: 64
  max_total_tokens: 896
  temperature: 1.0
  top_p: 0.95
  max_parse_errors: 2
  max_repeated_calls: 2

selection:
  selector: tool_and_final     # supervise only the structurally critical tokens
  critical_weight: 1.0
  other_weight: 1.0

loss:
  mode: bucketed_topk_tail
  divergence: jsd              # symmetric: useful when the teacher's context differs
  jsd_beta: 0.5
  temperature: 1.0
  scale_by_temperature_squared: true
  top_k: 64
  chunk_size: 256

train:
  cycles: 8
  rollouts_per_cycle: 8
  gradient_accumulation_steps: 8
  opd_freshness: strict
  learning_rate: 1.0e-4
  max_grad_norm: 1.0
  warmup_steps: 2
  lr_schedule: cosine
  optimizer: adamw8bit
  sft_warmup_cycles: 8
  save_every_cycles: 4
  eval_every_cycles: 4

memory:
  strategy: auto
  oom_retries: 3
  min_chunk_size: 16

cache:
  entries_per_shard: 8
  strict_policy_version: true
  reuse_across_policy_versions: false
  dtype: float16
  keep_cycles: 2

eval:
  enabled: true
  split: eval
  tasks: 16
  temperature: 0.0
  seed: 0

report:
  enabled: true
  max_trajectories: 4
  max_tokens_per_trajectory: 320
