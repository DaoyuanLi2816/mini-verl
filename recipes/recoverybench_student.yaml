# RecoveryBench v1 Qwen3-0.6B student / Qwen3-1.7B teacher base recipe.
# Final test runs are launched only through the schema-v3 benchmark configs.

schema_version: 1

run:
  name: recoverybench-student
  mode: opd
  seed: 1234
  output_dir: runs
  deterministic: true
  tags: [recoverybench, qwen3, single-gpu, protocol-v2]

models:
  backend: hf
  device: auto
  student:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: bfloat16
    quantization: nf4
    attn_implementation: sdpa
    gradient_checkpointing: true
    lora:
      enabled: true
      r: 16
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  teacher:
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    tokenizer_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    dtype: bfloat16
    quantization: nf4
    attn_implementation: sdpa
    mode: standard
    # First preregistered candidate to pass the complete RecoveryBench eval gate.
    adapter:
      source: hub
      path: DaoyuanLi/mini-verl-qwen3-1.7b-sqlite-recovery-teacher
      revision: eb2747895ec32dab47c5b50c2d8aa9c0d9701e0d
      require_policy_evaluation: true
      minimum_strict_success_rate: 0.8
      minimum_recovery_after_error_rate: 0.75
      minimum_parse_valid_tool_call_rate: 0.95
      minimum_tool_execution_success_rate: 0.7

environment:
  name: sqlite_recovery
  difficulty: hard
  params: {protocol_version: v2}
  train_tasks: 256
  eval_tasks: 96
  test_tasks: 128
  split_seed: 20260801

rollout:
  max_turns: 5
  max_new_tokens_per_turn: 96
  max_total_tokens: 1536
  temperature: 1.0
  top_p: 0.95
  max_parse_errors: 2
  max_repeated_calls: 2

selection:
  selector: all_model_tokens
  ratio: 1.0
  critical_weight: 1.0
  other_weight: 1.0

loss:
  mode: bucketed_topk_tail
  divergence: reverse_kl
  temperature: 1.0
  scale_by_temperature_squared: true
  top_k: 64
  chunk_size: 256
  sampled_token_nll_weight: 0.0

train:
  cycles: 8
  rollouts_per_cycle: 8
  gradient_accumulation_steps: 8
  opd_freshness: strict
  learning_rate: 1.0e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_steps: 2
  lr_schedule: cosine
  optimizer: adamw8bit
  sft_warmup_cycles: 0
  save_every_cycles: 4
  eval_every_cycles: 0

memory:
  strategy: auto
  oom_retries: 3
  min_chunk_size: 16
  empty_cache_between_phases: true
  reset_peak_stats_each_cycle: true

cache:
  entries_per_shard: 8
  strict_policy_version: true
  reuse_across_policy_versions: false
  dtype: float16
  keep_cycles: 2
  verify_checksums_on_load: true

eval:
  enabled: true
  split: eval
  tasks: 96
  temperature: 0.0
  max_turns: 5
  seed: 20260801

report:
  enabled: true
  max_trajectories: 8
  max_tokens_per_trajectory: 768
