# QLoRA SFT for a protocol-v2 Qwen3-1.7B RecoveryBench teacher candidate.
# Candidate selection is eval-only; final test is not used by this recipe.

schema_version: 1

run:
  name: recoverybench-qwen3-1.7b-teacher-a
  mode: sft
  seed: 20260801
  output_dir: runs
  deterministic: true
  tags: [recoverybench, teacher, qwen3, qlora, protocol-v2]

models:
  backend: hf
  device: auto
  student:
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    tokenizer_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    dtype: bfloat16
    quantization: nf4
    attn_implementation: sdpa
    gradient_checkpointing: true
    lora:
      enabled: true
      r: 16
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  # SFT does not load this teacher; the stable identity keeps one config schema.
  teacher:
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    tokenizer_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    dtype: bfloat16
    quantization: none
    mode: standard

environment:
  name: sqlite_recovery
  difficulty: hard
  params: {protocol_version: v2}
  train_tasks: 256
  eval_tasks: 96
  test_tasks: 128
  split_seed: 20260801

rollout:
  max_turns: 5
  max_new_tokens_per_turn: 96
  max_total_tokens: 1536
  temperature: 1.0
  top_p: 0.95
  max_parse_errors: 2
  max_repeated_calls: 2

selection:
  selector: all_model_tokens
  ratio: 1.0
  critical_weight: 1.0
  other_weight: 1.0

loss:
  mode: bucketed_topk_tail
  divergence: forward_kl
  temperature: 1.0
  scale_by_temperature_squared: false
  top_k: 64
  chunk_size: 256
  sampled_token_nll_weight: 1.0

train:
  cycles: 64
  rollouts_per_cycle: 8
  gradient_accumulation_steps: 8
  opd_freshness: strict
  learning_rate: 1.0e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_steps: 4
  lr_schedule: cosine
  optimizer: adamw8bit
  sft_warmup_cycles: 0
  save_every_cycles: 16
  eval_every_cycles: 0

memory:
  strategy: resident
  oom_retries: 3
  min_chunk_size: 16
  empty_cache_between_phases: true
  reset_peak_stats_each_cycle: true

cache:
  entries_per_shard: 8
  strict_policy_version: true
  reuse_across_policy_versions: false
  dtype: float16
  keep_cycles: 1
  verify_checksums_on_load: true

eval:
  enabled: true
  baseline_enabled: false
  split: eval
  tasks: 96
  temperature: 0.0
  max_turns: 5
  seed: 20260801

report:
  enabled: false
  max_trajectories: 12
  max_tokens_per_trajectory: 768
