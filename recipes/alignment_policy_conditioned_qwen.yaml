# Qwen3 policy-conditioned self-distillation on one CUDA GPU.
# The frozen teacher sees the private rubric; the student never does.

schema_version: 1
run:
  name: qwen3-policy-conditioned-alignment
  mode: opd
  seed: 1234
  output_dir: runs
  deterministic: true
  tags: [alignment, policy-conditioned, single-gpu, qwen3]
models:
  backend: hf
  runtime: dual_model
  device: auto
  student:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: auto
    quantization: nf4
    attn_implementation: eager
    gradient_checkpointing: true
    lora:
      enabled: true
      r: 16
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  teacher:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
    dtype: auto
    quantization: nf4
    attn_implementation: eager
    mode: privileged_context
    adapter:
      source: hub
      path: DaoyuanLi/mini-verl-qwen3-0.6b-tool-policy-sft
      revision: 7b98164f73e493c51f2ed3fca3169fea078f47f0
      base_model_revision: c1899de289a04d12100db370d81485cdf75e47ca
      require_policy_evaluation: true
      minimum_strict_success_rate: 0.9
      minimum_parse_valid_tool_call_rate: 0.95
      minimum_tool_execution_success_rate: 0.7
environment:
  name: tool_policy
  difficulty: easy
  params: {protocol_version: v2, prompt_style: full}
  train_tasks: 96
  eval_tasks: 24
  test_tasks: 24
  split_seed: 20260802
rollout:
  max_turns: 4
  max_new_tokens_per_turn: 64
  max_total_tokens: 1024
  temperature: 0.8
  top_p: 0.95
selection:
  selector: all_model_tokens
loss:
  mode: bucketed_topk_tail
  divergence: reverse_kl
  top_k: 64
  chunk_size: 128
train:
  cycles: 4
  rollouts_per_cycle: 4
  gradient_accumulation_steps: 4
  trajectory_batch_size: 4
  opd_freshness: strict
  learning_rate: 5.0e-5
  lr_schedule: cosine
  optimizer: adamw8bit
  sft_warmup_cycles: 12
  save_every_cycles: 0
  eval_every_cycles: 0
memory: {strategy: resident, oom_retries: 3, min_chunk_size: 16}
cache:
  entries_per_shard: 4
  strict_policy_version: true
  reuse_across_policy_versions: false
  dtype: float16
  keep_cycles: 2
eval:
  enabled: true
  baseline_enabled: true
  split: eval
  tasks: 12
  temperature: 0.0
  max_turns: 4
  seed: 20260802
report: {enabled: true, max_trajectories: 6, max_tokens_per_trajectory: 512}
alignment:
  method: standard_opd
  teacher_mode: policy_conditioned
  policy:
    id: miniverl-tool-policy
    revision: v1
    sha256: 9a9316bea117928d115eff86291982d7386e6ca2d7127aacb933e508d322c8a8
    license: Apache-2.0
  pilot:
    sample_size: 24
    teacher_policy_competence: 1.0
    student_baseline_alignment: 1.0
    teacher_student_topk_overlap: 0.0
    fresh_state_gap: 0.0
    hard_soft_gap: 0.0
    policy_sensitive_token_fraction: 0.67
    verifier_precision: 1.0
    estimated_vram_gib: 3.0
    estimated_time_seconds: 180
    uncertainty_half_width: 0.20
  limitations:
    - Small deterministic sandbox suite; no broad safety claim.

