# Fully pinned SmolLM2 recipe for the direct-GKD v0.8 profile.
data:
  train_files: [data/train.parquet]
  val_files: []
  prompt_key: prompt
  train_batch_size: 4
  max_prompt_length: 128
  max_response_length: 64
  filter_overlong_prompts: false
  truncation: error
  shuffle: true
  seed: 17
actor_rollout_ref:
  model:
    path: HuggingFaceTB/SmolLM2-360M-Instruct
    enable_gradient_checkpointing: true
    lora_rank: 8
    lora_alpha: 16
    target_modules: [q_proj, v_proj]
    lora_adapter_path: null
  actor:
    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_warmup_steps: 0
    loss_agg_mode: token-mean
    use_kl_loss: false
    ppo_mini_batch_size: 4
    ppo_max_token_len_per_gpu: 768
    use_dynamic_bsz: true
  rollout:
    name: vllm
    n: 1
    temperature: 1.0
    top_p: 0.95
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    max_model_len: 192
    max_num_batched_tokens: 768
    max_num_seqs: 4
algorithm:
  use_kl_in_reward: false
distillation:
  enabled: true
  teacher_key: data_source
  n_gpus_per_node: 1
  nnodes: 1
  teacher_models:
    teacher_model:
      model_path: HuggingFaceTB/SmolLM2-1.7B-Instruct
      num_replicas: 1
      inference:
        name: vllm
        dtype: bfloat16
        tensor_model_parallel_size: 1
        data_parallel_size: 1
        pipeline_model_parallel_size: 1
        gpu_memory_utilization: 0.5
        max_model_len: 193
  distillation_loss:
    loss_mode: forward_kl_topk
    topk: 32
    use_task_rewards: false
    distillation_loss_coef: 1.0
    loss_max_clamp: null
    log_prob_min_clamp: -10.0
    use_policy_gradient: false
trainer:
  project_name: mini-verl
  experiment_name: smollm2-opd-developer-workload
  save_freq: 4
  test_freq: 8
  total_epochs: 1
  total_training_steps: 8
  n_gpus_per_node: 1
  nnodes: 1
miniverl:
  student_revision: a10cc1512eabd3dde888204e902eca88bddb4951
  teacher_revision: 31b70e2e869a7173562077fd711b654946d38674
  actor_runtime:
    dtype: auto
    quantization: nf4
    attn_implementation: sdpa
  teacher_runtime:
    quantization: nf4
    attn_implementation: sdpa
  runtime:
    mode: dual_model_resident
  memory:
    vram_limit_gib: 16
    headroom_gib: 1.5
  batching:
    rollout_batch_size: 4
    teacher_score_batch_size: 4
    update_trajectory_batch_size: 1
  teacher_adapter:
    path: null
    revision: null
