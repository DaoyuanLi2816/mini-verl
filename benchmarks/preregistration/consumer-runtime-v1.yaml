schema_version: 1
name: consumer-runtime-v1
status: preregistered_before_headline_measurement
implementation_commit: f0ddcf85226ce21eb53aa514b4c56363e9b810b5
registered_at_utc: 2026-08-03T00:26:16Z

question: >-
  On one consumer CUDA GPU, how do physical trajectory batching and a
  shared-base student/teacher adapter runtime change update throughput and peak
  VRAM without changing the selected-position distillation objective?

claim_scope:
  allowed:
    - measured runtime and memory comparisons on the declared RTX 4080
    - numerical equivalence within the declared tolerances
    - standard PEFT student export and role-isolation behavior
  forbidden:
    - task-quality improvement from batching or adapter sharing
    - universal speedup across GPUs, models, sequence lengths or CUDA stacks
    - distributed, Ray, FSDP, DataProto or verified-verl-runtime parity

hardware:
  gpu: NVIDIA GeForce RTX 4080
  total_vram_bytes: 17170956288
  driver: 596.49
  torch: 2.13.0+cu130
  transformers: 5.14.1
  peft: 0.19.1
  bitsandbytes: 0.50.0

model:
  base_id: Qwen/Qwen3-0.6B
  base_revision: c1899de289a04d12100db370d81485cdf75e47ca
  tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
  dtype: bfloat16
  quantization: nf4
  student_adapter:
    initialization: deterministic fresh LoRA
    r: 16
    alpha: 32
    dropout: 0.0
  frozen_teacher_adapter:
    repo: DaoyuanLi/mini-verl-qwen3-0.6b-consumer-runtime-teacher
    revision: e277b92d8c1fdb76cd133f872f0ddd2c47a4ab8c
    role: systems benchmark only; not a newly qualified teacher
    source_checkpoint_digest: 44add6eaa18e52a807323a733991dcec724b8a3ad4869d8f776fbb3c18f70cc2
    adapter_config_sha256: a0a3d8ba706fc7de3d19434af509df2637b3ebc00c557e3341a80b568a54228a
    adapter_weights_sha256: 985ee30e044bbd106e1c5265f5f4917fd3aca37a18b5cb9a8ed438a1de137e7a
    manifest_sha256: 1188fe6e5f25eab93371c71b32cf0a428e99a3f964f2fee8e95d2fec68b52202

workload:
  environment: sqlite_recovery
  protocol_version: v2
  difficulty: hard
  split: train
  split_seed: 20260801
  ordered_tasks: 8
  trajectory_source: deterministic oracle traces
  max_total_tokens: 896
  selector: all_model_tokens
  objective:
    mode: bucketed_topk_tail
    divergence: reverse_kl
    top_k: 64
    temperature: 1.0
    chunk_size: 64
  invariants_across_cells:
    - ordered task identities
    - token sequences and attention masks before padding
    - selected prediction positions and token weights
    - teacher targets and teacher adapter revision
    - student initialization and optimizer hyperparameters
    - one optimizer update over eight trajectories

matrix:
  model_ownership: [dual_model_resident, shared_backbone_resident]
  physical_trajectory_batch: [1, 2, 4, auto]
  auto_definition: all eight trajectories in one padded backbone forward
  orthogonal_required_cells:
    - dual_model sequential
    - dual_model padded
    - shared_backbone sequential
    - shared_backbone padded
  swap_diagnostic:
    ownership: dual_model
    batch: auto
    status: secondary
    note: shared_backbone is explicitly resident because its roles own one physical base

measurement:
  warmup_updates: 1
  measured_updates: 3
  seeds: [20260801]
  synchronization: torch.cuda.synchronize before and after each timed region
  reset_peak_stats: before each measured update
  isolated_engine_regions:
    - student selected-state forward
    - teacher selected-state scoring
    - adapter role switch
    - selected-position loss backward
    - optimizer step
  end_to_end_region: target construction plus one complete policy update
  metrics:
    - median_seconds
    - min_seconds
    - trajectories_per_second
    - selected_positions_per_second
    - peak_allocated_bytes
    - peak_reserved_bytes
    - padding_tokens
    - adapter_switch_microseconds
  profiler:
    activities: [cpu, cuda]
    schedule: one_warmup_then_one_active_update
    summaries: top_cuda_self_time_and_memory_operators

equivalence:
  loss_absolute_tolerance: 1.0e-5
  gradient_absolute_tolerance: 3.0e-4
  gradient_relative_tolerance: 3.0e-3
  updated_logit_absolute_tolerance: 3.0e-3
  updated_logit_relative_tolerance: 3.0e-3
  teacher_logit_absolute_tolerance: 2.0e-3
  no_padding_in_loss: required
  no_cross_sequence_attention: required
  no_dense_batch_sequence_vocab_logits: required

larger_model_diagnostic:
  models: [4B, 7B]
  headline: false
  attempt_only_if:
    - an immutable compatible base and teacher adapter are already available
    - projected peak reserved VRAM is below 15 GiB
    - the exact cell can complete and be measured without changing the workload contract
  otherwise_report: not_run_with_reason

outputs:
  result: benchmarks/results/consumer-runtime-v1.json
  profiler: benchmarks/results/consumer-runtime-v1-profiler.json
  pareto_svg: docs/consumer-runtime-v1-pareto.svg
  report: docs/consumer-runtime-v1.md

invalidation_policy:
  invalidate_if:
    - preregistration commit is not public before the first headline measurement
    - any matrix cell changes tasks, sequences, positions, targets or objective
    - model or adapter revision is unpinned
    - CUDA synchronization or peak-stat reset is omitted
    - completed failures or OOM cells are discarded
    - result or profiler schema validation fails
  retain_failed_and_oom_cells: true
