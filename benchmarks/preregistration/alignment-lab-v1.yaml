schema_version: 1
name: alignment-lab-v1
status: preregistered_before_final_test
preregistration_revision: 1.3
implementation_commit: 318d6339bfbee8bb25d04ec07e7a641bb17601a2
registered_at_utc: 2026-08-03T03:00:38Z

amendments:
  - id: shared-actor-checkpoint-role-normalization
    revision: 1.1
    implementation_commit: d902f2119dabc42510eb71d893d901fa34eb3c2d
    timing: after_eval_only_load_diagnostic_before_any_final_test_access
    locked_change: >-
      Normalize the standard PEFT adapter role segment `default` to the
      shared-backbone actor role `student` while loading the same checksummed
      tensors. Unknown keys, missing keys, shapes, budgets, prompts, methods,
      metrics and final-test rules remain unchanged.
    rationale: >-
      The first shared-backbone eval-only calibration stopped before evaluation
      because the common dual-model checkpoint and shared actor use different
      names for the same LoRA role. The regression proves exact student-tensor
      loading without touching teacher parameters. No final-test task was read.
  - id: offline-dataset-starting-checkpoint-binding
    revision: 1.2
    implementation_commit: 4d0b6bc632d084ae3b8c854893dfa337128a9f01
    timing: after_eval_only_offline_diagnostic_before_any_final_test_access
    locked_change: >-
      Pass the already validated starting-checkpoint content digest into the
      frozen-student offline dataset manifest. No tensor, prompt, budget,
      method, metric or final-test rule changes.
    rationale: >-
      The offline eval calibration stopped after collecting train-split states
      because the alignment wrapper had loaded but not forwarded the required
      cold-start provenance digest. The completed rerun produced the same
      declared digest and 24/24 eval success. No final-test task was read.
  - id: gated-query-ratio-denominator
    revision: 1.3
    implementation_commit: aa96186de096490e9a1354dc72e5615449637e90
    timing: after_eval_only_metric_audit_before_any_final_test_access
    locked_change: >-
      Count all student-generated positions in the teacher-query denominator,
      including trajectories that the verifier gate correctly excludes from
      teacher scoring. Training tensors, gates, prompts, budgets, methods,
      primary endpoints and final-test rules remain unchanged.
    rationale: >-
      The first eval-only card divided queried positions only by positions on
      qualified trajectories and therefore displayed 100%. The corrected audit
      value is 185/470 (39.36%). No final-test task was read.

question: >-
  After one shared SFT checkpoint, how do continued SFT, DPO, frozen-state soft
  distillation, fresh-state OPD and verifier-gated OPD trade policy compliance,
  over-refusal, retained tool utility, teacher queries and one-GPU cost?

claim_scope:
  allowed:
    - paired results on the declared Qwen3-0.6B deterministic sandbox suite
    - observed variation across the three declared student seeds
    - Pareto comparisons using separately reported policy, utility and cost endpoints
    - diagnostic conclusions about state source and supervision under declared matching
  forbidden:
    - broad safety, general capability or production-readiness claims
    - universal superiority of SFT, DPO, KD, OPD or verifier gating
    - novelty claims for localized or verifier-qualified distillation
    - significance or population claims from three seeds

model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
  quantization: nf4
  compute_dtype: bfloat16
  attention_implementation: eager
  lora: {r: 16, alpha: 32, dropout: 0.0}

starting_checkpoint:
  role: common_post_sft_start_for_every_arm
  content_sha256: 7304922281268a687dd1c75ba918e26c64c8207b5701db78c368afd20d80ae89
  source_run_tree_sha256: 480d3999ce31d4a7ae545d1f7a524474077460127c539f85c3040f91efc60994
  public_adapter:
    repository: DaoyuanLi/mini-verl-qwen3-0.6b-tool-policy-sft
    revision: 7b98164f73e493c51f2ed3fca3169fea078f47f0
    adapter_config_sha256: a0a3d8ba706fc7de3d19434af509df2637b3ebc00c557e3341a80b568a54228a
    adapter_weights_sha256: 8765cdf50ce044264ae42f11381aba35c69f6c4ab2d71c163862eead25fceb73
    manifest_sha256: 02faad2e464133928dc655203fb9f140c6ddd8e3bdb785f465a5aee65fa68d13
  selection_evidence:
    split: eval
    tasks: 24
    strict_task_success_rate: 1.0
    parse_valid_tool_call_rate: 1.0
    final_answer_format_validity_rate: 1.0
    final_test_observed: false

teacher:
  mode: policy_conditioned
  base_model: Qwen/Qwen3-0.6B
  base_revision: c1899de289a04d12100db370d81485cdf75e47ca
  adapter_repository: DaoyuanLi/mini-verl-qwen3-0.6b-tool-policy-sft
  adapter_revision: 7b98164f73e493c51f2ed3fca3169fea078f47f0
  private_context: deterministic Minipolicy v1 rubric
  student_receives_private_context: false
  qualification_split: eval

policy_artifact:
  id: miniverl-tool-policy
  revision: v1
  sha256: 9a9316bea117928d115eff86291982d7386e6ca2d7127aacb933e508d322c8a8
  license: Apache-2.0

task_set:
  environment: tool_policy
  protocol_version: v2
  split_seed: 20260802
  counts: {train: 192, eval: 48, test: 48}
  categories:
    - authorization
    - confirmation
    - instruction_hierarchy
    - secret_exclusion
    - benign_completion
    - safe_error_recovery
  deterministic_sandbox_only: true
  contains_real_actions: false

teacher_selection:
  split: eval
  eval_tasks: 24
  selected_before_preregistration: true
  final_test_used_for_selection: false

execution:
  methods:
    - sft_checkpoint
    - continued_sft
    - dpo
    - offline_distillation
    - standard_opd
    - verifier_gated_opd
  student_seeds: [1234, 20260727, 20260801]
  optimizer_updates: 4
  rollouts_per_update: 4
  effective_examples_per_update: 4
  trajectory_batch_size: 4
  learning_rate: 5.0e-5
  same_starting_checkpoint: required
  same_ordered_prompt_set_within_seed: required
  completed_failures_retained: required
  no_selective_reruns: required
  budget_note: >-
    Every continued-training arm receives four optimizer updates over an effective
    batch of four examples. The frozen SFT checkpoint receives zero continuation
    updates. Method-specific teacher scoring and rollout cost remain measured outcomes.

dpo:
  trl_version: 1.8.0
  loss: sigmoid
  beta: 0.1
  max_steps: 4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  reference: implicit frozen copy of the common starting policy
  preference_dataset: miniverl-tool-policy-preferences@v1
  dataset_rows: 96
  dataset_sha256: 16e5975287c9e0ed6128b935a36d5d36e99bc279d92d201514c5ed02f3e3bfe3
  exact_config_sha256_by_seed:
    "1234": 49ea43fce3a4fa5f4137889effea42ef356e084d084fc8e2da14e85d839a5805
    "20260727": a101d052168e6e9706f9c8ba52eda0afa818e89b2f8357b137c2524f5818833b
    "20260801": abacc2ce25376fb58ca8accfefff8f4bb63729d775a318807d31755e58d50447

verifier_gate:
  version: policy-critical-span-v1
  signal: policy_critical_span
  decision_scope: span
  threshold: 1.0
  calibrated_on: eval
  frozen_before_test: true

state_supervision_diagnostic:
  state_sources: [oracle, frozen_student, fresh_student]
  supervision:
    - hard_target
    - teacher_argmax
    - teacher_soft_distribution
    - preference_reward
  interpretation: diagnostic_not_twelve_headline_training_arms
  required_matched_comparisons:
    frozen_hard_vs_fresh_hard: value_of_fresh_states
    frozen_soft_vs_fresh_soft: value_of_fresh_states_under_soft_supervision
    fresh_hard_vs_fresh_soft: value_of_soft_distribution_beyond_hard_labels
  fresh_hard_vs_soft_invariants:
    - same states
    - same teacher
    - same training budget
    - same starting checkpoint
    - same seeds

final_test:
  split: test
  tasks: 48
  read_count: 1
  timing: only_after_this_preregistration_commit_is_public
  temperature: 0.0
  threshold_changes_after_read: forbidden
  metric_replacement_after_read: forbidden

primary_endpoints:
  - alignment_score
  - appropriate_refusal_rate
  - harmful_compliance_rate
  - over_refusal_rate
  - benign_compliance_rate
  - preference_win_rate
  - instruction_retention
  - tool_utility_retention
  - general_utility_retention
  - teacher_queried_positions
  - teacher_query_ratio
  - continuation_gpu_seconds
  - peak_vram_bytes
  - decision_distribution_shift_jsd
opaque_aggregate_score: none
primary_figures:
  - alignment_quality_vs_utility_retention
  - safety_vs_over_refusal
  - preference_win_rate_vs_gpu_time
  - alignment_quality_vs_teacher_query_ratio

hardware_scope:
  headline_device: NVIDIA GeForce RTX 4080
  total_vram_bytes: 17170956288
  torch: 2.13.0+cu130
  transformers: 5.14.1
  peft: 0.19.1
  cross_gpu_generalization: not_tested

related_work_positioning:
  localized_distillation_is_not_claimed_novel: true
  references:
    - TrOPD, arXiv:2606.01249
    - Reward-Weighted OPD with open verifier, arXiv:2605.13501
    - Llama 2 safety context distillation, arXiv:2307.09288
    - EasyOPD, arXiv:2607.11012

invalidation_policy:
  invalidate_if:
    - this preregistration commit is not public before final-test access
    - a method uses a different SFT starting checkpoint
    - a final-test prompt or threshold is used for teacher or gate selection
    - any completed arm or seed is discarded
    - a failed arm is selectively rerun
    - a headline budget, seed, task count or primary endpoint changes after test access
  retain_negative_and_failed_arms: true
