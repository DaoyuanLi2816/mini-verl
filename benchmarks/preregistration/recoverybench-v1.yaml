schema_version: 1
name: recoverybench-v1
preregistration_revision: 1.4
status: preregistered_before_final_test
research_question: >-
  Does supervision on fresh states visited by the current student improve
  recovery from tool errors relative to distillation on a fixed set of states
  collected from the cold-start student?
code_commit: 68072aef0a27a4bb8d7fb1d84064286170b3dacf

hypotheses:
  H1: >-
    Strict fresh-state OPD has a higher recovery-after-error rate than offline
    KD on frozen cold-start-student trajectories under equal optimizer updates.
  H2: >-
    Budgeted fresh-state OPD using at most 50% of model-generated teacher-query
    positions preserves most of the full-OPD recovery gain.
  H3: >-
    Quality must be interpreted with GPU time, teacher queries, and peak VRAM;
    no method is declared superior from task success alone.

endpoints:
  primary:
    - recovery_after_error_rate
    - strict_task_success_rate
  secondary:
    - success_given_first_query_error
    - valid_sql_execution_rate
    - turns_to_recovery
    - tokens_per_solved_task
    - teacher_queried_position_ratio
    - train_seconds
    - wall_seconds
    - peak_allocated_bytes
    - peak_reserved_bytes
  subsets: [controlled_intervention, natural_error, no_intervention]

models:
  student:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
  teacher_base:
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    tokenizer_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  selected_adapter_revision_rule: >-
    The first candidate passing every gate is uploaded when needed, and its
    immutable Hub commit is frozen in the final benchmark configuration before
    any test run.

teacher_qualification:
  split: eval
  inference_quantization: nf4
  rollout:
    max_turns: 5
    max_new_tokens_per_turn: 96
    max_total_tokens: 1536
    temperature: 0.0
  candidate_order:
    - id: existing-calculator-protocol-teacher
      adapter_repo: DaoyuanLi/mini-verl-qwen3-1.7b-protocol-teacher
      adapter_revision: 23323751318135484c06c043b1f9b9e7016dd89f
    - id: sqlite-recovery-candidate-a
      training_seed: 20260801
      adapter_repo_if_selected: DaoyuanLi/mini-verl-qwen3-1.7b-sqlite-recovery-teacher
    - id: sqlite-recovery-candidate-b
      training_seed: 20260727
      adapter_repo_if_selected: DaoyuanLi/mini-verl-qwen3-1.7b-sqlite-recovery-teacher
    - id: sqlite-recovery-candidate-c
      training_seed: 1234
      adapter_repo_if_selected: DaoyuanLi/mini-verl-qwen3-1.7b-sqlite-recovery-teacher
  gate:
    strict_task_success_rate: {operator: greater_than_or_equal, value: 0.80}
    recovery_after_error_rate: {operator: greater_than_or_equal, value: 0.75}
    parse_valid_tool_call_rate: {operator: greater_than_or_equal, value: 0.95}
    tool_execution_success_rate: {operator: greater_than_or_equal, value: 0.70}
  failed_candidates_are_retained: true
  test_split_forbidden: true

amendments:
  - id: teacher-inference-quantization
    revision: 1.1
    timing: before_any_final_test
    scope: teacher_eval_and_all_kd_opd_arms
    locked_value: nf4
    rationale: >-
      Candidate adapters are trained by QLoRA on an NF4 base. A portability
      check showed that applying the adapter to an unquantized base changes the
      deployed policy, so qualification and downstream supervision must reload
      the same NF4 base representation.
    preserved_diagnostic: >-
      The completed candidate-A full-precision reapplication is retained as a
      failed noncanonical deployment diagnostic; it is not silently discarded.
  - id: teacher-gate-decode-scope
    revision: 1.1
    timing: before_candidate_a_nf4_gate_completion_and_before_any_final_test
    scope: teacher_eval_only
    locked_value:
      max_turns: 5
      max_new_tokens_per_turn: 96
      max_total_tokens: 1536
      temperature: 0.0
    rationale: >-
      The candidate gate uses the already shared eval-only decoding contract;
      the separately declared 64/896 rollout budget remains the student-arm
      training and final-test contract.
  - id: eval-calibrated-secondary-budgets
    revision: 1.2
    timing: before_any_final_test
    scope: equal_selected_training_tokens_and_equal_gpu_wall_time
    calibration_result:
      path: artifacts/recoverybench-v1-calibration/recoverybench-v1-calibration.json
      sha256: af0cb73c60655c37c4bafba6ea7893e4bb7260e82c6b2915bb646b8872cbe35e
      split: eval
      seeds: [1234]
      test_tasks_generated: 0
      completed_selected_positions:
        continued_sft: 6675
        offline_kd_frozen_student: 6467
        strict_opd_fresh: 6224
      completed_continuation_seconds:
        continued_sft: 50.55608949996531
        offline_kd_frozen_student: 52.075989600038156
        strict_opd_fresh: 650.9775520999683
    locked_values:
      selected_training_tokens: 6224
      gpu_wall_seconds: 50
    rationale: >-
      The selected-position target is the minimum completed total. The wall
      target is the largest whole second not exceeding the minimum measured
      continuation training time. Arm wall time including evaluation was not
      used.
  - id: oracle-offline-task-schedule
    revision: 1.3
    timing: after_invalidated_partial_final_run_before_replacement_final_test
    scope: offline_kd_oracle
    locked_value:
      collection_tasks: 64
      update_batching: eight_ordered_tasks_per_optimizer_step
    defect: >-
      Revision 1.2 omitted collection_tasks for the oracle offline-KD arm, so
      its implementation collected the first eight schedule tasks once and
      replayed them for all eight updates instead of consuming the locked
      64-task prefix used by the other continuation arms.
    invalidated_artifacts: >-
      The interrupted seed-1234 primary run and its frozen bundle are preserved
      under artifacts/superseded/recoverybench-v1.2-oracle-schedule-defect/.
    remedy: >-
      Invalidate the entire partial v1.2 final run, set collection_tasks to 64,
      and rerun every arm and seed from fresh cold starts. No completed or
      partial v1.2 outcome is used in the replacement analysis.
  - id: wall-time-calibration-scope
    revision: 1.4
    timing: after_invalidated_wall_view_before_replacement_wall_test
    scope: equal_gpu_wall_time
    calibration_amendment:
      path: benchmarks/preregistration/recoverybench-v1-wall-time-amendment.json
      source_split: eval
      source_seed: 1234
      test_tasks_generated: 0
      completed_continuation_seconds:
        continued_sft: 24.582
        offline_kd_frozen_student: 25.001
        strict_opd_fresh: 624.163
    locked_value:
      gpu_wall_seconds: 24
      boundary: optimizer_step
    defect: >-
      Revision 1.2 calibrated the 50-second target from the benchmark harness
      train_seconds field, which includes final checkpoint persistence. The
      run-time stop gate intentionally excludes that final save and therefore
      reached the eight-cycle safety ceiling before 50 seconds for SFT and
      frozen-student KD.
    invalidated_artifacts: >-
      All nine completed revision-1.3 wall-view arms and their task records are
      preserved under artifacts/superseded/recoverybench-v1.3-equal-wall-time-cycle-cap-defect/;
      the result JSON SHA-256 is
      425b0fa568f37b09e61af731d3da5009bd3833bdde6efaf2c66e9dba8355cbe.
    remedy: >-
      Recompute the target exclusively from the frozen eval calibration's
      per-cycle measurements, lock the whole-second floor of the minimum at 24
      seconds, make publication reject any non-wall stop, and rerun all three
      wall-time methods for every prespecified seed. Equal-update and
      equal-selected-token final results are unaffected.

task_generation:
  environment: sqlite_recovery
  version: 1
  protocol_version: v2
  difficulty: hard
  split_seed: 20260801
  counts: {train: 256, eval: 96, test: 128}
  template_registry_version: 1
  template_registry_digest: 396c49c14641f8a282706e635f164ac72aa6f42d5c5b0fe2abd0c8f667168242
  training_task_schedule_digest: 0d937493eea9daadc36e7d29c7c4dace6e35b80a43e27e8af3b038b465f9a806
  schedule_definition: >-
    Canonical JSON of the ordered 256 train task identities and non-answer
    provenance fields generated by make_splits; every arm uses the same
    deterministic order and consumes the same prefix at each cycle.
  intervention_design:
    assignment: task_index_modulo_3
    controlled_schema_refresh: 0
    natural_sql_error: 1
    no_intervention: 2
    controlled_error_code: SCHEMA_REFRESH_REQUIRED
    controlled_error_retryable: true
    controlled_error_occurrences_per_episode: 1
    controlled_error_answer_free: true

seeds:
  model_and_training: [1234, 20260727, 20260801]
  split_and_tasks: 20260801
  analysis_bootstrap: 20260801

arms:
  - cold-start-only
  - continued-sft
  - offline-kd-oracle
  - offline-kd-frozen-student
  - strict-opd-fresh
  - strict-opd-fresh-budget50

hyperparameters:
  cold_start:
    cycles: 24
    rollouts_per_cycle: 8
    optimizer_steps: 24
  continuation:
    cycles: 8
    rollouts_per_cycle: 8
    gradient_accumulation_steps: 8
    optimizer_steps: 8
    learning_rate: 0.0001
    weight_decay: 0.0
    max_grad_norm: 1.0
    warmup_steps: 2
    lr_schedule: cosine
    optimizer: adamw8bit
  rollout:
    max_turns: 5
    max_new_tokens_per_turn: 64
    max_total_tokens: 896
    temperature: 1.0
    top_p: 0.95
  distillation:
    loss_mode: bucketed_topk_tail
    divergence: reverse_kl
    top_k: 64
    temperature: 1.0
    full_selector: all_model_tokens
    budget50_selector: uniform_budget
    budget50_ratio: 0.50
  teacher_candidate_training:
    method: qlora_sft
    cycles: 64
    rollouts_per_cycle: 8
    gradient_accumulation_steps: 8
    learning_rate: 0.0001
    protocol_version: v2

offline_kd:
  oracle_source: oracle
  frozen_student_source: frozen_student
  collection_seed_rule: model_and_training_seed
  collection_checkpoint: exact_shared_cold_start
  collection_updates: 0
  immutable_reuse: true
  oracle_collection_tasks: 64

budgets:
  equal_optimizer_updates:
    role: primary
    continuation_updates: 8
    arms: all
  equal_selected_training_tokens:
    role: secondary
    arms: [continued-sft, offline-kd-frozen-student, strict-opd-fresh]
    calibration: eval_only
    freeze_rule: >-
      Use the largest common selected-position target not exceeding the minimum
      completed total among the three calibration arms; stop only after an
      optimizer-step boundary and record nonnegative overshoot.
    final_numeric_value: 6224
  equal_gpu_wall_time:
    role: secondary
    arms: [continued-sft, offline-kd-frozen-student, strict-opd-fresh]
    calibration: eval_only
    included: [rollout, teacher_scoring, cache, backward, optimizer_update]
    excluded: [teacher_adapter_preparation]
    freeze_rule: >-
      Use the largest whole-second common budget not exceeding the minimum
      completed continuation time among the three calibration arms; stop only
      after an optimizer-step boundary and record nonnegative overshoot.
    final_numeric_seconds: 24
  teacher_preparation_reporting:
    - one_shot_total
    - amortized_over_5_students
    - amortized_over_10_students

statistics:
  seeds_required_per_headline_arm: 3
  report: [per_seed, mean, min, max]
  paired_bootstrap:
    replicates: 10000
    confidence: 0.95
    resampling_unit: paired_task_id_within_seed
    endpoints: [recovery_after_error_rate, strict_task_success_rate]
  paired_task_level_differences: true
  significance_claim_from_three_seeds: forbidden

invalidation_policy:
  invalidate_if:
    - preregistration_commit_not_public_before_first_final_test
    - test_outcome_inspected_before_all_choices_are_frozen
    - unpinned_selected_teacher_revision
    - task_or_template_digest_mismatch
    - cold_start_checkpoint_differs_within_seed
    - training_schedule_differs_across_arms
    - completed_arm_or_seed_omitted
    - schema_validation_or_artifact_hash_failure
  completed_failures_are_retained: true
  supersession_requires_new_versioned_artifact: true

result_analysis_version: recoverybench-analysis-v1
result_files:
  - benchmarks/results/recoverybench-v1-equal-updates.json
  - benchmarks/results/recoverybench-v1-equal-selected-tokens.json
  - benchmarks/results/recoverybench-v1-equal-wall-time.json
  - benchmarks/results/recoverybench-v1-task-results.jsonl
  - benchmarks/schema/recoverybench-result.schema.json
