# miniVERL equal-optimizer-update benchmark on a single RTX 4080 (16 GB).
#
# Why this exists separately from recipes/benchmark_calc.yaml: the toy backend
# can only solve the `easy` calculator split, where supervised fine-tuning
# saturates, so the CPU benchmark can demonstrate parity but not capability.
# This configuration uses the real Qwen3 pair on the `hard` split (compute an
# expression, then convert the result -- two dependent tool calls), which leaves
# headroom above the cold start.
#
# Every arm resumes from the SAME cold-start checkpoint, weights only, and gets
# the SAME number of optimizer steps. `eval.enabled: false` in the base turns off
# the per-arm baseline/final evaluations so the only evaluation is the harness's
# own held-out pass on the `test` split.
#
#   miniverl benchmark benchmarks/configs/gpu_calc_hard.yaml --output runs/benchmarks
#
# The seed set is prespecified for every arm. The first seed is diagnostic; the
# second is retained only if the same complete arm set runs correctly.

schema_version: 2
name: gpu-calc-hard-equal-update-v2
description: >-
  Cold start, then equal-optimizer-update continuation under supervised
  fine-tuning and on-policy distillation from raw, privileged-answer and
  protocol-SFT Qwen3-1.7B teachers on the chained calculator split.

base: ../../recipes/qwen_consumer_gpu_calc.yaml
common_overrides:
  environment: {difficulty: hard, test_tasks: 24}
  train:
    sft_warmup_cycles: 0
    learning_rate: 5.0e-5
    lr_schedule: constant
    opd_freshness: strict
  eval: {enabled: false, tasks: 24, split: test}
cold_start_overrides:
  environment: {difficulty: hard}
cold_start_cycles: 12
allowed_differences:
  - run.mode
  - train.cycles
  - loss.mode
  - loss.divergence
  - loss.top_k
  - models.teacher.mode
  - models.teacher.adapter
budget_axis: optimizer_steps
eval_split: test
seeds: [1234, 20260727]
output_dir: runs/benchmarks

arms:
  - name: cold-start-only
    description: The shared cold start, evaluated with zero further optimizer steps.
    overrides:
      run: {mode: sft}
      train: {cycles: 0}

  - name: sft-continued
    description: Off-policy baseline -- the same number of extra steps on oracle traces.
    overrides:
      run: {mode: sft}
      train: {cycles: 12}

  - name: opd-raw-teacher
    description: >-
      Genuine on-policy distillation -- the student's own rollouts, scored by the
      teacher on exactly those states, with compressed top-64 + tail reverse KL.
      The teacher here is the raw instruct checkpoint: it has never seen the tool
      protocol, which is the point of comparing it with the arm below.
    overrides:
      run: {mode: opd}
      train: {cycles: 12}
      loss: {mode: bucketed_topk_tail, divergence: reverse_kl, top_k: 64}
      models: {teacher: {mode: standard}}

  - name: opd-privileged-context
    description: >-
      The same on-policy distillation, but the teacher additionally sees an
      oracle block naming the verified answer, which the student never sees.
      Student and teacher prediction positions no longer coincide, so an explicit
      per-segment alignment map is built and target-token identity is verified.
      Follows arXiv:2602.12275.
    overrides:
      run: {mode: opd}
      train: {cycles: 12}
      loss: {mode: bucketed_topk_tail, divergence: reverse_kl, top_k: 64}
      models: {teacher: {mode: privileged_context}}

  - name: opd-protocol-sft-teacher
    description: >-
      The same strict on-policy objective supervised by a frozen Qwen3-1.7B
      LoRA adapter trained on deterministic oracle traces in the exact
      miniVERL tool protocol. This arm may run only after the teacher's own
      held-out tool-policy evaluation is recorded.
    overrides:
      run: {mode: opd}
      train: {cycles: 12}
      loss: {mode: bucketed_topk_tail, divergence: reverse_kl, top_k: 64}
      models:
        teacher:
          mode: standard
          adapter:
            source: local
            path: ../../artifacts/qwen3-1.7b-protocol-teacher
            require_policy_evaluation: true
            minimum_strict_success_rate: 0.5
