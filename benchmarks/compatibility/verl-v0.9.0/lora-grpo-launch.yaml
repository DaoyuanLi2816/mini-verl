actor_rollout_ref:
  actor:
    entropy_coeff: 0
    fsdp_config:
      optimizer_offload: false
      param_offload: false
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    optim:
      lr: 3.0e-06
    ppo_max_token_len_per_gpu: 12288
    ppo_mini_batch_size: 32
    use_dynamic_bsz: true
    use_kl_loss: true
  model:
    enable_gradient_checkpointing: true
    lora_alpha: 32
    lora_rank: 64
    path: Qwen/Qwen3-8B
    use_remove_padding: true
  ref:
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 12288
    log_prob_use_dynamic_bsz: true
  rollout:
    gpu_memory_utilization: 0.6
    layered_summon: true
    load_format: safetensors
    log_prob_max_token_len_per_gpu: 12288
    log_prob_use_dynamic_bsz: true
    n: 5
    name: vllm
    tensor_model_parallel_size: 2
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
data:
  filter_overlong_prompts: true
  max_prompt_length: 512
  max_response_length: 1024
  train_batch_size: 64
  train_files: /upstream-home/data/gsm8k/train.parquet
  truncation: error
  val_files: /upstream-home/data/gsm8k/test.parquet
trainer:
  balance_batch: true
  experiment_name: qwen3_8b_lora_vllm_fsdp
  logger:
  - console
  - wandb
  n_gpus_per_node: 2
  nnodes: 1
  project_name: verl_grpo_lora_gsm8k
  save_freq: 20
  test_freq: 5
  total_epochs: 15
  val_before_train: false
