name: Bug report
description: Something behaves incorrectly or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, run `miniverl doctor --json`. Review every attachment:
        do not paste tokens, home paths, proprietary prompts or model data.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >-
        The exact commands, and the recipe if you used one. If it reproduces with
        a shipped recipe or with `miniverl demo`, say which.
      render: shell
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `miniverl doctor --json`
      render: json
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: Sanitized config and manifest
      description: >-
        Optional but useful: config.validated.yaml and manifest.json with local
        paths, model data and identifiers replaced. Do not paste raw private run
        files merely because they are JSON/YAML.
      render: json
    validations:
      required: false

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or error output
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using a released version or a commit I can name.
          required: true
        - label: I have not pasted any secret, token or private path.
          required: true
