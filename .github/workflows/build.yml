name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  wheel:
    name: build and install from the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          ls -la dist/

      - name: The sdist must contain every reproducibility surface
        run: |
          python - <<'PY'
          import glob, tarfile
          [path] = glob.glob("dist/*.tar.gz")
          with tarfile.open(path) as archive:
              names = archive.getnames()
          for needed in (
              "recipes/toy_cpu.yaml",
              "tests/conftest.py",
              "scripts/build_pypi_readme.py",
              ".github/workflows/ci.yml",
              "PYPI.md",
              "CONTRIBUTING.md",
              "CODE_OF_CONDUCT.md",
              "SECURITY.md",
              "PROJECT_STATE.md",
              "environments/known-good-rtx4080-cu130.json",
              "environments/known-good-rtx4080-cu130.txt",
              "environments/known-good-rtx4080-wsl2-cu130.json",
              "environments/known-good-rtx4080-wsl2-cu130.txt",
              "scripts/run_v011_profile_qualification.py",
              "LICENSE",
              "README.md",
          ):
              assert any(n.endswith(needed) for n in names), f"{needed} missing from the sdist"
          print("sdist contents look right")
          PY

      - name: The wheel must contain every source module
        # An unanchored `models/` rule in .gitignore once matched
        # src/miniverl/models/ and silently dropped the whole package from the
        # wheel. Enumerating the source tree is the check that catches that
        # class of bug, rather than spot-checking a few known files.
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile
          [path] = glob.glob("dist/*.whl")
          names = set(zipfile.ZipFile(path).namelist())
          missing = [
              p.relative_to("src").as_posix()
              for pattern in ("*.py", "*.j2")
              for p in pathlib.Path("src/miniverl").rglob(pattern)
              if p.relative_to("src").as_posix() not in names
          ]
          assert not missing, f"missing from the wheel: {missing}"
          assert "miniverl/reporting/templates/report.html.j2" in names
          assert not any(n.startswith("tests/") for n in names), "tests must not ship in the wheel"
          print(f"wheel contains all {len(names)} entries, including every source module")
          PY

      - name: Nothing under a source directory may be git-ignored
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run(
              ["git", "status", "--ignored", "--short",
               "src", "tests", "recipes", "docs", "examples", "benchmarks", "scripts"],
              capture_output=True, text=True, check=True,
          ).stdout
          bad = [
              line for line in out.splitlines()
              if line.startswith("!!") and "__pycache__" not in line
          ]
          if bad:
              print("git-ignored files inside a source directory:")
              for line in bad:
                  print(line)
              sys.exit(1)
          print("no source file is git-ignored")
          PY

      - name: Install into a clean virtual environment and smoke test
        run: |
          python -m venv /tmp/wheel-test
          . /tmp/wheel-test/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          miniverl --help
          miniverl --version
          miniverl doctor --json > /tmp/doctor.json
          python -c "import json; d=json.load(open('/tmp/doctor.json')); assert d['verdict']['core_commands'] is True"
          python -c "import miniverl, sys; assert 'torch' not in sys.modules"
          deactivate

      - name: Install the training extra into a second clean environment
        run: |
          python -m venv /tmp/train-test
          . /tmp/train-test/bin/activate
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(echo dist/*.whl)[train]"
          miniverl doctor --json > /tmp/doctor-train.json
          python -c "import json; d=json.load(open('/tmp/doctor-train.json')); assert d['verdict']['cpu_training'] is True"
          MINIVERL_LOG_LEVEL=WARNING miniverl demo --output /tmp/wheel-demo --fast --json > /tmp/demo.json
          python -c "import json; d=json.load(open('/tmp/demo.json')); assert d['cycles_completed'] >= 1"
          test -f /tmp/wheel-demo/report.html
          deactivate

      - name: Reproduce tests and wheel from the extracted sdist
        run: |
          python - <<'PY'
          import glob, pathlib, tarfile
          [archive_path] = glob.glob("dist/*.tar.gz")
          destination = pathlib.Path("/tmp/miniverl-sdist-source")
          destination.mkdir()
          with tarfile.open(archive_path) as archive:
              archive.extractall(destination, filter="data")
          [root] = destination.iterdir()
          pathlib.Path("/tmp/miniverl-sdist-root.txt").write_text(str(root))
          PY
          SDIST_ROOT="$(cat /tmp/miniverl-sdist-root.txt)"
          python -m venv /tmp/sdist-test
          . /tmp/sdist-test/bin/activate
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "${SDIST_ROOT}[dev,train]"
          cd "$SDIST_ROOT"
          unset PYTHONPATH
          python -c "import miniverl, pathlib; assert pathlib.Path(miniverl.__file__).is_relative_to(pathlib.Path('/tmp/sdist-test'))"
          python scripts/build_pypi_readme.py --check
          ruff check .
          ruff format --check .
          mypy src/miniverl
          pytest -q -m "not gpu and not network"
          python -m build --wheel --outdir /tmp/sdist-wheel
          cd "$GITHUB_WORKSPACE"
          deactivate

      - name: The sdist-built wheel must match the repository wheel inventory
        run: |
          python - <<'PY'
          import glob, zipfile

          [repository_wheel] = glob.glob("dist/*.whl")
          [sdist_wheel] = glob.glob("/tmp/sdist-wheel/*.whl")

          def package_inventory(path):
              with zipfile.ZipFile(path) as archive:
                  return {
                      name
                      for name in archive.namelist()
                      if name.startswith("miniverl/")
                  }

          repository = package_inventory(repository_wheel)
          from_sdist = package_inventory(sdist_wheel)
          assert repository == from_sdist, (
              f"repository-only={sorted(repository - from_sdist)}; "
              f"sdist-only={sorted(from_sdist - repository)}"
          )
          assert not any(name.startswith(("tests/", "scripts/")) for name in repository)
          print(f"both wheels contain the same {len(repository)} package files")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
