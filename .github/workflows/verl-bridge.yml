name: pinned verl bridge

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.6.*"

permissions:
  contents: read

jobs:
  pinned-profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install miniVERL bridge environment
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install ".[bridge,train]" "hydra-core>=1.3,<2"
      - name: Install the exact official verl source without its distributed stack
        run: >-
          python -m pip install --no-deps
          "git+https://github.com/verl-project/verl.git@7aed6b230776f963fa09509c10d9c3a767d1102c"
      - name: Generate and export the standards smoke bundle
        run: |
          python scripts/prepare_verl_bridge_smoke.py --out _verl-smoke-source
          miniverl export-verl --run _verl-smoke-source --target-verl v0.8.0 --out _verl-smoke-bundle
      - name: Verify official config, standard artifacts, privacy and exact VCS pin
        run: >-
          python scripts/verify_verl_bridge_smoke.py _verl-smoke-bundle
          --out verl-bridge-smoke-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verl-bridge-smoke-report
          path: verl-bridge-smoke-report.json
          if-no-files-found: error
