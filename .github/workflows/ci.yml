name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The base install must work without torch. This job never installs it, so a
    # heavy import leaking into the core path fails here rather than in a user's
    # `pip install miniverl`.
    name: core (no torch) py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (base + dev only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert torch is absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          for name in ("torch", "transformers", "peft", "bitsandbytes"):
              assert importlib.util.find_spec(name) is None, f"{name} must not be installed here"
          import miniverl, miniverl.cli, miniverl.config, miniverl.schemas
          import miniverl.inspection, miniverl.reporting, miniverl.cache, miniverl.environments
          assert "torch" not in sys.modules, "importing miniverl pulled in torch"
          print("core import path is torch-free")
          PY

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy src/miniverl

      - name: pytest (torch-free subset)
        run: pytest -q -m "not torch and not gpu and not network" -ra

      - name: coverage gate for the pure core
        run: |
          pytest -q -m "not torch and not gpu and not network" \
            --cov=miniverl.config --cov=miniverl.schemas --cov=miniverl.trajectory \
            --cov=miniverl.selection --cov=miniverl.environments --cov=miniverl.agent.protocol \
            --cov=miniverl.inspection --cov=miniverl.errors --cov=miniverl.cache.stats \
            --cov-report=term-missing --cov-fail-under=85

      - name: CLI smoke (base install)
        run: |
          miniverl --help
          miniverl --version
          miniverl doctor --json > doctor.json
          python -c "import json; d=json.load(open('doctor.json')); assert d['verdict']['core_commands'] is True"
          for recipe in recipes/*.yaml; do
            case "$recipe" in
              *benchmark_calc.yaml) continue ;;
            esac
            miniverl validate "$recipe" --json > /dev/null
          done
          miniverl train recipes/toy_cpu.yaml --dry-run --json > plan.json
          python -c "import json; d=json.load(open('plan.json')); assert d['dry_run'] and not d['downloads_required']"
          miniverl schema --out /tmp/benchmark-result.schema.json
          python -c "import json; json.load(open('/tmp/benchmark-result.schema.json'))"
          diff -q /tmp/benchmark-result.schema.json benchmarks/schema/benchmark-result.schema.json

      - name: Missing extra produces an actionable message
        run: |
          set +e
          out=$(miniverl demo --output /tmp/should-not-exist 2>&1)
          status=$?
          set -e
          echo "$out"
          test $status -ne 0
          echo "$out" | grep -q 'pip install "miniverl\[train\]"'

  cpu-ml:
    name: cpu ml (torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,train]"

      - name: pytest (full CPU suite, with coverage gate)
        env:
          MINIVERL_LOG_LEVEL: WARNING
          HF_HUB_OFFLINE: "1"
        run: |
          pytest -q -m "not gpu and not network" -ra \
            --cov=miniverl --cov-report=term-missing --cov-fail-under=80

      - name: End-to-end demo and every read-only command
        env:
          MINIVERL_LOG_LEVEL: WARNING
        run: |
          miniverl demo --output /tmp/miniverl-demo --fast --json > demo.json
          python -c "import json; d=json.load(open('demo.json')); assert d['cycles_completed'] >= 1"
          test -f /tmp/miniverl-demo/manifest.json
          test -f /tmp/miniverl-demo/trajectories.jsonl
          test -f /tmp/miniverl-demo/teacher-cache/index.json
          test -f /tmp/miniverl-demo/report.html
          miniverl inspect /tmp/miniverl-demo/trajectories.jsonl --json > inspect.json
          python - <<'PY'
          import json
          d = json.load(open("inspect.json"))
          excluded = d["provenance_check"]["context_span_types_excluded_from_loss"]
          assert "tool_result" in excluded, excluded
          assert 0.0 < d["model_token_fraction"] < 1.0
          PY
          miniverl cache stats /tmp/miniverl-demo/teacher-cache --json > cache.json
          python -c "import json; d=json.load(open('cache.json')); assert d['problems']==[] and d['compression_ratio']>0"
          miniverl cache validate /tmp/miniverl-demo/teacher-cache
          miniverl report /tmp/miniverl-demo --out /tmp/miniverl-demo/report.html
          python - <<'PY'
          html = open("/tmp/miniverl-demo/report.html", encoding="utf-8").read()
          assert "http://" not in html and "https://" not in html, "report must be self-contained"
          assert "<script" not in html.lower()
          PY
          miniverl eval --run /tmp/miniverl-demo --tasks 2 --json > eval.json
          python -c "import json; json.load(open('eval.json'))"
          miniverl export-benchmark /tmp/miniverl-demo --json > export.json
          python - <<'PY'
          import json
          from miniverl.evaluation.schema import BenchmarkResult
          BenchmarkResult.model_validate(json.load(open("export.json"))["result"])
          PY

      - name: No unfinished implementation markers
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # `raise NotImplementedError` marks an unfinished implementation.
          # *Catching* one is the opposite: defensive handling of a dependency
          # that raises it, so only the raising form is a defect here.
          pattern = re.compile(r"\b(TODO|FIXME|XXX|HACK)\b|raise\s+NotImplementedError")
          bad = []
          for root in ("src", "tests", "examples", "scripts"):
              for path in pathlib.Path(root).rglob("*.py"):
                  for i, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      if pattern.search(line):
                          bad.append(f"{path}:{i}: {line.strip()}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("no unfinished implementation markers")
          PY

  training-boundaries:
    name: training ${{ matrix.name }} py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python-version: "3.10"
            torch: "2.3.*"
            transformers: "4.51.*"
            peft: "0.12.*"
            accelerate: "0.33.*"
            numpy: "1.24.*"
            bitsandbytes: "0.43.*"
          - name: latest
            python-version: "3.13"
            torch: ""
            transformers: ""
            peft: ""
            accelerate: ""
            numpy: ""
            bitsandbytes: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install declared training boundary
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.name }}" == "minimum" ]]; then
            pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
            pip install \
              "transformers==${{ matrix.transformers }}" \
              "peft==${{ matrix.peft }}" \
              "accelerate==${{ matrix.accelerate }}" \
              "numpy==${{ matrix.numpy }}" \
              "bitsandbytes==${{ matrix.bitsandbytes }}"
            pip install -e ".[dev]"
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -e ".[dev,train,cuda]"
          fi

      - name: Report resolved boundary
        run: |
          python - <<'PY'
          import importlib.metadata as md
          for name in ("torch", "transformers", "peft", "accelerate", "numpy", "bitsandbytes"):
              print(name, md.version(name))
          from transformers import Qwen3Config
          from bitsandbytes.nn import Linear4bit
          assert Qwen3Config(vocab_size=128).vocab_size == 128
          assert Linear4bit is not None
          PY

      - name: No-network toy training smoke
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          MINIVERL_LOG_LEVEL: WARNING
        run: |
          pytest -q \
            tests/integration/test_toy_pipeline.py::test_sft_completes_without_loading_a_teacher \
            tests/integration/test_manifest_lifecycle.py::test_successful_training_finalizes_manifest_without_changing_startup

  transformers-compat:
    name: transformers ${{ matrix.transformers-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Qwen3 entered Transformers in 4.51.0. The 5.x row continuously tests
        # the latest supported major/minor under the package's explicit <6 cap.
        transformers-version: ["4.51.*", "5.*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the selected compatibility boundary
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==${{ matrix.transformers-version }}"
          pip install -e ".[dev,train]"

      - name: Verify Qwen3 and the offline HF/PEFT contract
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python - <<'PY'
          import importlib.metadata
          from transformers import Qwen3Config
          print("transformers", importlib.metadata.version("transformers"))
          assert Qwen3Config(vocab_size=128).vocab_size == 128
          PY
          pytest -q tests/integration/test_hf_backend_offline.py tests/unit/test_config.py -ra
