site_name: miniVERL
site_description: Run a documented subset of verl-style OPD on one consumer GPU
site_url: https://daoyuanli2816.github.io/mini-verl/
repo_url: https://github.com/DaoyuanLi2816/mini-verl
repo_name: DaoyuanLi2816/mini-verl
edit_uri: edit/main/docs/
exclude_docs: |
  history/*
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
plugins:
  - search
nav:
  - Home: index.md
  - For verl users: for-verl-users.md
  - Compatibility profiles: profiles/index.md
  - PG-k1 semantic ADR: adr/0010-verl-v0.8-pg-k1-contract.md
  - Config overrides: config-overrides.md
  - Immutable plans: immutable-plans.md
  - Hardware planning: hardware-planning.md
  - Current verl-style OPD runtime: verl-opd-runtime.md
  - Run verl-style OPD: opd-quickstart.md
  - RTX 4080 developer workload: verl-opd-reference-workload.md
  - RTX 4080 PG-k1 workload: verl-pg-k1-workload.md
  - Start on one GPU: single-gpu-guide.md
  - Align:
      - "External Alignment Gate v1: early stop": alignment-external/alignment-external-v1.md
      - When OPD should follow SFT: alignment-lab/when-opd-should-follow-sft.md
      - "Alignment Lab v1: saturated case study": alignment-lab/alignment-lab-v1.md
      - External benchmark governance: alignment-external/benchmark-governance.md
  - Distill locally:
      - Consumer runtime: consumer-runtime/index.md
      - Runtime benchmarking: benchmarking.md
      - RecoveryBench: recoverybench/recoverybench-v1.md
  - Scale out:
      - Current OPD scale-out: verl-opd-scaleout.md
      - Materialize a handoff: scaleout-materialization.md
      - Launch requirements: verl-bridge-launch.md
      - Demo recording script: verl-bridge-demo.md
      - Legacy environment/PPO bridge: legacy-verl-bridge.md
  - Community benchmarks: community-benchmarks.md
  - Schemas:
      - Trajectories: trajectory-schema.md
      - Benchmark results: benchmarking.md
  - Limitations: limitations.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/versioning.js
copyright: miniVERL is an independent project; no endorsement by upstream projects is implied.
