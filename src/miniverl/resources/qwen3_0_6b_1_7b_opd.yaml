data:
  train_files: [data/opd-smoke.parquet]
  val_files: []
  prompt_key: prompt
  train_batch_size: 2
  max_prompt_length: 128
  max_response_length: 16
  filter_overlong_prompts: false
  truncation: error
  shuffle: false
  seed: 20260812
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-0.6B
    enable_gradient_checkpointing: true
    lora_rank: 8
    lora_alpha: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    lora_adapter_path: null
  actor:
    optim: {lr: 1e-5, weight_decay: 0.0, lr_warmup_steps: 0}
    loss_agg_mode: token-mean
    use_kl_loss: false
    ppo_mini_batch_size: 2
    ppo_max_token_len_per_gpu: 512
    use_dynamic_bsz: true
  rollout:
    # Upstream-shaped vocabulary. The compatibility report records that
    # miniVERL executes this with its local HF rollout runtime, not vLLM.
    name: vllm
    n: 1
    temperature: 0.0
    top_p: 1.0
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    max_model_len: 144
    max_num_batched_tokens: 288
    max_num_seqs: 2
algorithm: {use_kl_in_reward: false}
distillation:
  enabled: true
  teacher_key: data_source
  n_gpus_per_node: 1
  nnodes: 1
  teacher_models:
    teacher_model:
      model_path: Qwen/Qwen3-1.7B
      num_replicas: 1
      inference:
        # Likewise compiled into the sequential local teacher-scoring phase.
        name: vllm
        dtype: bfloat16
        tensor_model_parallel_size: 1
        data_parallel_size: 1
        pipeline_model_parallel_size: 1
        gpu_memory_utilization: 0.5
        max_model_len: 144
  distillation_loss:
    loss_mode: forward_kl_topk
    topk: 32
    use_task_rewards: false
    distillation_loss_coef: 1.0
    loss_max_clamp: null
    log_prob_min_clamp: -10.0
    use_policy_gradient: false
trainer:
  project_name: mini-verl
  experiment_name: qwen3-opd-quickstart
  save_freq: 1
  test_freq: -1
  total_epochs: 1
  total_training_steps: 1
  n_gpus_per_node: 1
  nnodes: 1
miniverl:
  student_revision: c1899de289a04d12100db370d81485cdf75e47ca
  teacher_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  runtime: {mode: auto}
  memory: {vram_limit_gib: 16.0, headroom_gib: 1.5}
  batching:
    rollout_batch_size: 2
    teacher_score_batch_size: 2
    update_trajectory_batch_size: 1
  teacher_adapter: {path: null, revision: null}
